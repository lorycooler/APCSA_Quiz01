<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Java Practice Lab · APCSA 完整題庫 v1</title>
<style>
:root{--bg:#f4f3ee;--ink:#243830;--muted:#6d7c73;--green:#205b44;--line:#dde3da;--accent:#dceacb;--white:#fff;--red:#a84139}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a2c9ad;outline-offset:3px}button{color:inherit}nav{display:flex;align-items:center;justify-content:space-between;gap:15px;max-width:1240px;margin:auto;padding:24px 32px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.4px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--green);color:#fff;font:800 20px monospace}.nav-right{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted)}.pill{border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:#fff}.container{max-width:1176px;margin:0 auto;padding:42px 24px 60px}.eyebrow{text-transform:uppercase;letter-spacing:2.2px;font-size:11px;font-weight:750;color:var(--green)}h1{font-size:clamp(30px,4.6vw,54px);line-height:1.2;letter-spacing:-2px;margin:18px 0}h2{font-size:25px;letter-spacing:-.6px;margin:0 0 12px}h3{font-size:19px;letter-spacing:-.4px}.sub{font-size:15px;line-height:1.9;color:var(--muted);max-width:660px}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;margin-bottom:34px}.hero-panel{background:#e6ecdf;border:1px solid #d8e1d1;border-radius:22px;padding:25px}.hero-code{font:13px/1.9 Consolas,monospace;white-space:pre-wrap;margin:16px 0 0}.code-accent{color:#397456}.hero-top{display:flex;justify-content:space-between;color:var(--green);font-size:11px;letter-spacing:1px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:19px}.section-head h2{margin:0;font-size:21px}.small{font-size:12px;color:var(--muted);line-height:1.8}.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.chapter{background:white;border:1px solid var(--line);border-radius:18px;padding:27px;position:relative}.chapter-top{display:flex;align-items:center;justify-content:space-between;font:11px Consolas,monospace;color:var(--muted);letter-spacing:1px}.chapter h3{font-size:24px;margin:22px 0 8px}.chapter p{line-height:1.8;font-size:13px;color:var(--muted);min-height:46px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 22px}.tag{font-size:11px;padding:5px 9px;border-radius:6px;background:#f1f4ee;color:#607461}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 18px;font-weight:650;font-size:13px;text-decoration:none}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.primary:hover:enabled{background:#164630}.btn.ghost{background:transparent}.btn.full{width:100%}.chapter.locked{background:#eeeee7;border-style:dashed;opacity:.7}.chapter.locked h3{font-size:21px}.chapter.locked p{min-height:0;margin-bottom:0}.progress-track{height:5px;background:#e9eee5;border-radius:99px;overflow:hidden;margin:14px 0}.progress-track div{background:var(--green);height:100%;transition:width .2s}.progress-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:19px}.footer{border-top:1px solid var(--line);font-size:11px;line-height:1.9;color:var(--muted);margin-top:32px;padding-top:18px}.footer a{color:var(--green)}.back{border:none;background:none;padding:0;margin-bottom:24px;color:var(--muted);font-size:13px}.unit-heading{margin-bottom:28px}.unit-heading h1{font-size:36px}.practice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.practice-card{padding:25px;border:1px solid var(--line);background:white;border-radius:18px}.practice-card h3{margin:15px 0 9px}.practice-card p{min-height:48px;line-height:1.8;color:var(--muted);font-size:13px}.practice-card .meta-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:18px 0}.practice-card select{border:1px solid var(--line);border-radius:8px;background:white;padding:8px;font-size:12px;max-width:100%}.set-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:14px 18px;border:1px solid #d7e1cc;background:#eaf0e2;border-radius:12px;color:#526848;font-size:12px;line-height:1.8;margin-top:22px}.session-layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:22px;align-items:start}.question-card{background:white;border:1px solid var(--line);border-radius:18px;padding:30px;min-width:0}.question-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-bottom:20px}.question-card h2{font-size:19px;line-height:1.85;font-weight:600;letter-spacing:0;white-space:pre-wrap;overflow-wrap:anywhere}.code{background:#f1f4ed;border:1px solid #e2e8dc;border-radius:12px;padding:21px;overflow:auto;white-space:pre;font:14px/2 Consolas,"Cascadia Code",monospace;color:#30473c;tab-size:4;max-width:100%;margin:20px 0}.blank{font:inherit;line-height:1.5;min-width:85px;max-width:230px;border:1px solid #79a087;border-bottom:3px solid var(--green);background:white;border-radius:5px;padding:3px 7px;color:var(--green);vertical-align:baseline}.blank.correct{background:#e0f1e1;border-color:#438252}.blank.wrong{background:#fff0ed;border-color:var(--red);color:var(--red)}.choices{display:grid;gap:11px;margin:22px 0}.choice{display:flex;align-items:baseline;gap:13px;padding:16px;border-radius:11px;border:1px solid var(--line);background:white;text-align:left;width:100%;font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.choice:hover:enabled{background:#f0f5eb;border-color:#9bb48d}.choice:disabled{opacity:1}.letter{font:700 13px Consolas,monospace;background:#eef2e9;border-radius:6px;flex-shrink:0;padding:4px 8px}.choice.selected-correct{background:#e7f2e7;border-color:#6c9b73}.choice.selected-wrong{background:#fff0ec;border-color:#cf8176}.feedback{padding:17px;border-radius:12px;margin-top:20px;font-size:13px;line-height:1.85;background:#f2f5ed}.feedback.correct{background:#e8f3e5}.feedback.wrong{background:#fff1eb}.feedback p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.feedback code{font:13px Consolas,monospace}.source{font-size:10px;color:#7e897d;line-height:1.8;border-top:1px solid var(--line);padding-top:15px;margin-top:22px}.question-nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.rail{padding:20px;background:#eceee5;border:1px solid var(--line);border-radius:16px}.rail h3{margin:0 0 10px;font-size:14px}.question-dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:15px 0}.dot{font:12px Consolas,monospace;border:1px solid #d8ddcf;border-radius:6px;aspect-ratio:1;background:#fff;display:grid;place-items:center}.dot.now{outline:2px solid var(--green);outline-offset:1px}.dot.ok{background:#d1e4c9}.dot.bad{background:#f0d3c9}.result-top{text-align:center;padding:30px}.score{font-size:76px;letter-spacing:-5px;color:var(--green);font-weight:800;margin:15px 0}.score small{font-size:20px;letter-spacing:0;color:var(--muted)}.review-list{display:grid;gap:13px;max-width:850px;margin:auto}.review-card{background:white;border:1px solid var(--line);padding:23px;border-radius:14px}.review-card h3{font-size:15px;line-height:1.8;margin:0 0 9px}.review-card p{font-size:13px;line-height:1.8;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.result-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.empty{padding:30px;text-align:center;color:var(--muted)}[hidden]{display:none!important}@media(max-width:850px){.session-layout{grid-template-columns:minmax(0,1fr)}.rail{order:-1;padding:15px}.question-dots{display:none}.rail .small{display:inline}.hero{grid-template-columns:1fr}.hero-panel{display:none}}@media(max-width:600px){nav{padding:18px 18px}.nav-right .pill{display:none}.container{padding:29px 16px 40px}h1{letter-spacing:-1.2px}.chapter-grid,.practice-grid{grid-template-columns:1fr}.chapter{padding:22px}.question-card{padding:20px 16px}.question-card h2{font-size:17px}.code{font-size:13px;padding:16px}.choice{font-size:14px;padding:14px 12px}.question-meta{font-size:10px}.btn{padding:12px 14px}.section-head{align-items:flex-start}.section-head .small{max-width:100px;text-align:right}.unit-heading h1{font-size:29px}.score{font-size:65px}.review-card{padding:18px}.blank{min-width:75px}}
.set-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.set-card{display:flex;flex-direction:column}.set-card .btn{margin-top:auto}.set-no{font:700 28px Consolas,monospace;color:var(--green);margin:13px 0}.unit-summary{margin:22px 0 30px;padding:15px 19px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted);line-height:1.8}.section-space{margin-top:34px}@media(max-width:850px){.set-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.set-grid{grid-template-columns:1fr}.unit-summary{font-size:12px}}
</style></head><body>
<nav><div class="brand"><div class="mark">J.</div><span>Java Practice Lab</span></div><div class="nav-right"><span class="pill">AP CSA · 4 UNITS</span><span>VERSION 1.0</span></div></nav>
<main class="container"><section id="home"></section><section id="unit" hidden></section><section id="practice" hidden></section><section id="results" hidden></section><footer class="footer">APCSA 第一版 · 4 單元 · __FILL_COUNT__ 題填空＋__MCQ_COUNT__ 題選擇，共 __TOTAL_COUNT__ 題。排除繼承與多型。<br>題目包含 CB PDF 原題重新排版與主題改編；各題標示來源類型。章節按現行四單元架構整理。<br>純靜態網頁，無登入與資料庫，不讀寫瀏覽器儲存空間；重新整理或關閉頁面後，本次作答會清除。</footer></main>
<script>

const CONFIG=__CONFIG__;
const BANK=CONFIG.questions,UNITS=CONFIG.units,byId=new Map(BANK.map(q=>[q.id,q]));
let session=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){for(const x of ['home','unit','practice','results'])$(x).hidden=x!==id;window.scrollTo(0,0)}
function group(unit,type,set){return BANK.filter(q=>q.unit===unit&&q.type===type&&(set===undefined||q.set===set))}
function groups(unit,type){return [...new Set(group(unit,type).map(q=>q.set))].sort((a,b)=>a-b)}
function home(){show('home');$('home').innerHTML=`<div class="hero"><div><div class="eyebrow">A little practice, a clearer mind.</div><h1>一步一步，<br>把 Java 寫進直覺。</h1><p class="sub">選擇章節，從程式填空到選擇題。<br>讀懂每一行，也理解每一次判斷。</p></div><div class="hero-panel"><div class="hero-top"><span>YOUR NEXT SMALL WIN</span><span>JAVA</span></div><pre class="hero-code"><span class="code-accent">String</span> goal = "Understand, not memorize";\n<span class="code-accent">for</span> (int day = 0; day &lt; 7; day++) {\n    practice();\n    confidence++;\n}</pre></div></div><div class="section-head"><h2>選擇你的學習單元</h2><span class="small">4 個單元 · ${BANK.length} 題<br>每份練習獨立計分</span></div><div class="chapter-grid">${UNITS.map(u=>`<article class="chapter"><div class="chapter-top"><span>UNIT 0${u.id}</span><span>${group(u.id,'fill').length+group(u.id,'mcq').length} QUESTIONS</span></div><h3>${u.title}</h3><div class="small">${u.en}</div><p>${u.description}</p><div class="tags">${u.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="small" style="margin-bottom:20px">填空 ${groups(u.id,'fill').length} 份 · 選擇 ${groups(u.id,'mcq').length} 份</div><button class="btn primary full" data-unit="${u.id}">進入單元 →</button></article>`).join('')}</div>`;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>unitPage(Number(b.dataset.unit)))}
function unitPage(id){const u=UNITS.find(x=>x.id===id);show('unit');$('unit').innerHTML=`<button class="back" id="backHome">← 所有單元</button><div class="unit-heading"><div class="eyebrow">UNIT 0${id} · ${u.en}</div><h1>${u.title}</h1><p class="sub">${u.description}</p></div><div class="unit-summary">按題型選擇一份練習。填空每份 20 題、選擇每份 16 題；提交後立即顯示答案與解析，完成整份後顯示百分制成績。<br>填空保留 Java 大小寫與運算子差異；語意等價但未收錄的寫法不一定會被接受，請依提示填寫。</div><div class="section-head"><h2>01 · 程式填空</h2><span class="small">每份 20 題</span></div><div class="practice-grid">${groups(id,'fill').map(set=>`<article class="practice-card set-card"><div class="eyebrow">CODE COMPLETION</div><h3>填空題 · 第 ${set} 份</h3><p>${esc(u.sets[set-1]||'進階語法練習')}<br>填入關鍵字、型別、方法或運算子。</p><div class="meta-row"><span>${group(id,'fill',set).length} 題 · 每題 1 空</span><span>填寫後核對</span></div><button class="btn primary full" data-type="fill" data-set="${set}">開始這份練習 →</button></article>`).join('')}</div><div class="section-head section-space"><h2>02 · 選擇題</h2><span class="small">每份 16 題</span></div><div class="set-grid">${groups(id,'mcq').map(set=>{const topics=[...new Set(group(id,'mcq',set).map(q=>q.topic))];return `<article class="practice-card set-card"><div class="eyebrow">MULTIPLE CHOICE</div><div class="set-no">0${set}</div><h3>選擇題 · 第 ${set} 份</h3><p>${topics.slice(0,4).map(esc).join('、')}等主題。</p><div class="meta-row"><span>${group(id,'mcq',set).length} 題 · 四選一</span><span>即時答案與解析</span></div><button class="btn primary full" data-type="mcq" data-set="${set}">開始這份練習 →</button></article>`}).join('')}</div>`;$('backHome').onclick=home;document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const type=b.dataset.type,set=Number(b.dataset.set);start(group(id,type,set).map(q=>q.id),id,`Unit ${id} · ${type==='fill'?'填空題':'選擇題'}第 ${set} 份`)})}
function start(ids,unit,title){if(!ids.length)return;session={ids,unit,title,index:0,answers:{},drafts:{}};renderQuestion()}
// Token comparison preserves Java case, literal contents and operator boundaries.
function normalize(text){return (text.trim().match(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[A-Za-z_$][\w$]*|\d+(?:\.\d+)?|>>>|>>|<<|\+\+|--|&&|\|\||==|!=|<=|>=|\+=|-=|\*=|\/=|%=|\S/g)||[]).join('\u0000')}
function isFillCorrect(q,values){return values.length===q.answers.length&&values.every((v,i)=>q.answers[i].some(a=>normalize(v)===normalize(a)))}
function renderQuestion(){show('practice');const q=byId.get(session.ids[session.index]),a=session.answers[q.id],done=Object.keys(session.answers).length;const code=q.code?`<pre class="code" id="codeArea"></pre>`:'';$('practice').innerHTML=`<button class="back" id="leave">← 返回單元</button><div class="session-layout"><article class="question-card"><div class="question-meta"><span>${esc(session.title)}</span><span>${q.type==='fill'?'程式填空':'選擇題'} · ${session.index+1} / ${session.ids.length}</span></div><div class="eyebrow">${esc(q.topic)}</div><h2 id="prompt"></h2>${code}<div id="answerArea"></div><div id="feedback" role="status" aria-live="polite"></div><div class="source">${esc(q.source)}</div><div class="question-nav"><button class="btn" id="previous" ${session.index===0?'disabled':''}>← 上一題</button><button class="btn primary" id="next" ${a?'':'disabled'}>${session.index===session.ids.length-1?'查看本次成績':'下一題 →'}</button></div></article><aside class="rail"><h3>這一份的進度</h3><div class="small">已提交 ${done} / ${session.ids.length} 題</div><div class="progress-track"><div style="width:${100*done/session.ids.length}%"></div></div><div class="question-dots">${session.ids.map((id,i)=>{const r=session.answers[id];return `<span class="dot ${i===session.index?'now':''} ${r?(r.correct?'ok':'bad'):''}">${i+1}</span>`}).join('')}</div><p class="small">${q.type==='fill'?'填入空格後按「核對答案」。Java 大小寫會影響答案。':'點選一個選項，立即核對答案。'}<br>得分以整份練習的答對比例計算。</p></aside></div>`;$('prompt').textContent=q.prompt;if(q.type==='fill'){const pieces=q.code.split('___');const box=$('codeArea');pieces.forEach((piece,i)=>{box.append(document.createTextNode(piece));if(i<q.answers.length){const input=document.createElement('input');input.className='blank';input.setAttribute('aria-label',`第 ${i+1} 個空格`);input.autocomplete='off';input.autocapitalize='off';input.spellcheck=false;input.value=a?a.values[i]:(session.drafts[q.id]?.[i]||'');input.disabled=!!a;input.size=Math.min(18,Math.max(7,q.answers[i][0].length+2));if(a)input.classList.add(q.answers[i].some(ans=>normalize(ans)===normalize(a.values[i]))?'correct':'wrong');input.oninput=()=>{session.drafts[q.id]=[...document.querySelectorAll('.blank')].map(x=>x.value);};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submitFill()}};box.append(input)}});$('answerArea').innerHTML=`<button class="btn primary" id="check" ${a?'disabled':''}>核對答案</button><p class="small" id="inputHint">保留 Java 大小寫；忽略不影響語法的空格。</p>`;$('check').onclick=submitFill}else{if(q.code)$('codeArea').textContent=q.code;$('answerArea').innerHTML=`<div class="choices">${q.options.map((o,i)=>{const letter='ABCD'[i];let status='';if(a){if(letter===q.answer)status='selected-correct';else if(letter===a.value)status='selected-wrong'}return `<button class="choice ${status}" data-choice="${letter}" ${a?'disabled':''}><span class="letter">${letter}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>commit(q,{value:b.dataset.choice,correct:b.dataset.choice===q.answer}))}if(a){$('feedback').className=`feedback ${a.correct?'correct':'wrong'}`;const title=document.createElement('strong');title.textContent=a.correct?'✓ 答對了，繼續前進。':'這題再記一下，下次就會了。';const p=document.createElement('p');p.textContent=q.type==='fill'?`正確填法：${q.answers.map(x=>x.join(' 或 ')).join('；')}`:`正確答案：${q.answer} — ${q.options['ABCD'.indexOf(q.answer)]}`;const e=document.createElement('p');e.textContent=q.explanation;$('feedback').append(title,p,e)}$('leave').onclick=()=>unitPage(session.unit);$('previous').onclick=()=>{session.index--;renderQuestion()};$('next').onclick=()=>{if(!session.answers[q.id])return;if(session.index<session.ids.length-1){session.index++;renderQuestion()}else finish()}}
function submitFill(){const q=byId.get(session.ids[session.index]);if(session.answers[q.id])return;const values=[...document.querySelectorAll('.blank')].map(x=>x.value);if(values.some(v=>!v.trim())){$('inputHint').textContent='請先填寫所有空格，再核對答案。';document.querySelector('.blank:enabled')?.focus();return}commit(q,{values,correct:isFillCorrect(q,values)})}
function commit(q,answer){if(session.answers[q.id])return;session.answers[q.id]=answer;renderQuestion();$('feedback').scrollIntoView({block:'nearest',behavior:'smooth'})}

function answerText(q,a){return q.type==='fill'?a.values.join('；'):a.value+' — '+q.options['ABCD'.indexOf(a.value)]}
function finish(){if(Object.keys(session.answers).length!==session.ids.length)return;const correct=session.ids.filter(id=>session.answers[id].correct).length,wrong=session.ids.filter(id=>!session.answers[id].correct);show('results');$('results').innerHTML=`<div class="result-top"><div class="eyebrow">PRACTICE COMPLETE</div><h2>${esc(session.title)}</h2><div class="score">${Math.round(100*correct/session.ids.length)}<small> / 100</small></div><p class="sub" style="margin:0 auto 24px">答對 ${correct} 題 · 答錯 ${wrong.length} 題 · 共 ${session.ids.length} 題<br>得分 = ${correct} ÷ ${session.ids.length} × 100${100*correct/session.ids.length%1?'（四捨五入）':''}</p><div class="result-actions"><button class="btn primary" id="resultBack">返回單元</button><button class="btn" id="repeat">整份重新練習</button><button class="btn" id="allUnits">所有單元</button></div></div><div class="section-head"><h2>${wrong.length?'本次作答解析':'全部答對，這份已經掌握！'}</h2><span class="small">僅本次結果，不保存紀錄</span></div><div class="review-list">${wrong.map(id=>{const q=byId.get(id),a=session.answers[id];return `<article class="review-card"><div class="eyebrow">${esc(q.topic)}</div><h3>${esc(q.prompt)}</h3>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}<p>你的答案：${esc(answerText(q,a))}</p><p><strong>正確答案：${esc(q.type==='fill'?q.answers.map(x=>x.join(' 或 ')).join('；'):q.answer+' — '+q.options['ABCD'.indexOf(q.answer)])}</strong></p><p>${esc(q.explanation)}</p><div class="source">${esc(q.source)}</div></article>`}).join('')}</div>`;const previous=session;$('resultBack').onclick=()=>unitPage(previous.unit);$('repeat').onclick=()=>start(previous.ids,previous.unit,previous.title);$('allUnits').onclick=home}
home();

</script></body></html>
