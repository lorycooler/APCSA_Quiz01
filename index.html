}", "options": ["36", "21", "22", "6"], "answer": "B", "explanation": "遞迴展開後是 6 + 5 + 4 + 3 + 2 + 1 + 0 = 21。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "recursion"}, {"id": "u4-m4-16", "unit": 4, "type": "mcq", "set": 4, "topic": "選擇排序一回合", "prompt": "What does a contain after this first selection-sort pass?", "code": "int[] a = {12, 10, 7, 5};\nint min = 0;\nfor (int k = 1; k \u003c a.length; k++) {\n    if (a[k] \u003c a[min]) { min = k; }\n}\nint temp = a[0];\na[0] = a[min];\na[min] = temp;", "options": ["[12, 10, 7, 5]", "[5, 10, 7, 12]", "[10, 7, 5, 12]", "[5, 7, 10, 12]"], "answer": "B", "explanation": "找到最小值 5 的索引 3，與索引 0 交換，其他元素不變。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "selection-pass"}, {"id": "u1-m5-01", "unit": 1, "type": "mcq", "set": 5, "topic": "整數運算", "prompt": "What is printed?", "code": "int a = 9;\nint b = 17;\nSystem.out.print(a + b / 3 * 2);", "options": ["17", "20", "19", "21"], "answer": "C", "explanation": "整數除法 17 / 3 = 5，乘以 2 後加上 9，結果為 19。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "precedence"}, {"id": "u1-m5-02", "unit": 1, "type": "mcq", "set": 5, "topic": "型別轉換", "prompt": "What is the value of x?", "code": "double x = (double) 17 / 2;", "options": ["8.5", "8.0", "17.0", "19.0"], "answer": "A", "explanation": "先轉為 double，再除以 2，保留小數得到 8.5。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "cast-before-divide"}, {"id": "u1-m5-03", "unit": 1, "type": "mcq", "set": 5, "topic": "字串串接", "prompt": "What is printed?", "code": "System.out.print(\"N=\" + 7 + 8);", "options": ["N=78", "15", "N=15", "N=87"], "answer": "A", "explanation": "左邊已是字串，+ 由左至右進行串接，所以依序接上 7 與 8。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "concat"}, {"id": "u1-m5-04", "unit": 1, "type": "mcq", "set": 5, "topic": "substring", "prompt": "What is printed?", "code": "String word = \"FUNCTION\";\nSystem.out.print(word.substring(3, 6));", "options": ["ON", "CTIO", "CTI", "NCTI"], "answer": "C", "explanation": "擷取索引 3 到 5，不含結束索引 6。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "substring"}, {"id": "u1-m5-05", "unit": 1, "type": "mcq", "set": 5, "topic": "String.length", "prompt": "What is the value of size?", "code": "String text = \"Method Call\";\nint size = text.length();", "options": ["11", "12", "0", "10"], "answer": "A", "explanation": "length() 計算全部字元，包含空格，共 11 個。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "length"}, {"id": "u1-m5-06", "unit": 1, "type": "mcq", "set": 5, "topic": "indexOf", "prompt": "What is printed?", "code": "String text = \"avocado\";\nSystem.out.print(text.indexOf(\"do\"));", "options": ["6", "5", "-1", "7"], "answer": "B", "explanation": "第一次出現 \"do\" 的索引為 5，索引從 0 開始。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "indexOf"}, {"id": "u1-m5-07", "unit": 1, "type": "mcq", "set": 5, "topic": "Math.abs", "prompt": "What is printed?", "code": "System.out.print(Math.abs(-19) + 5);", "options": ["24", "-14", "14", "19"], "answer": "A", "explanation": "絕對值為 19，再加 5 得到 24。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "abs"}, {"id": "u1-m5-08", "unit": 1, "type": "mcq", "set": 5, "topic": "Math.pow", "prompt": "What is the value of result?", "code": "double result = Math.pow(6, 3);", "options": ["216.0", "222.0", "217.0", "36.0"], "answer": "A", "explanation": "Math.pow(6, 3) 表示 6 的三次方，結果為 216.0。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "pow"}, {"id": "u1-m5-09", "unit": 1, "type": "mcq", "set": 5, "topic": "Math.sqrt", "prompt": "What is the value of result?", "code": "double result = Math.sqrt(64);", "options": ["8.0", "7.0", "9.0", "64.0"], "answer": "A", "explanation": "8 × 8 = 64，平方根為 8.0。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "sqrt"}, {"id": "u1-m5-10", "unit": 1, "type": "mcq", "set": 5, "topic": "Math.random", "prompt": "Which inclusive integer range can result?", "code": "int value = (int) (Math.random() * 9) + 7;", "options": ["1 through 9", "7 through 16", "0 through 9", "7 through 15"], "answer": "D", "explanation": "轉成 int 後為 0 到 8；加 7 後為 7 到 15。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "random-range"}, {"id": "u1-m5-11", "unit": 1, "type": "mcq", "set": 5, "topic": "參數型別", "prompt": "Assume double average(int total, int count) is defined. Which assignment compiles?", "code": "", "options": ["double result = average(50.5, 6);", "double result = average(true, 6);", "int result = average(50, 6);", "double result = average(50, 6);"], "answer": "D", "explanation": "方法要求兩個 int，並回傳 double；double 區域變數可接收結果。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-types"}, {"id": "u1-m5-12", "unit": 1, "type": "mcq", "set": 5, "topic": "例外判斷", "prompt": "Which value of y causes an ArithmeticException?", "code": "int x = 7 / y;", "options": ["0", "1", "-1", "7"], "answer": "A", "explanation": "int 除以 0 會造成 ArithmeticException。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "division-zero"}, {"id": "u1-m5-13", "unit": 1, "type": "mcq", "set": 5, "topic": "實例方法", "prompt": "Sensor has a public non-static void method read(). Object sensor is initialized in another class. Which call is valid?", "code": "", "options": ["Sensor.read();", "read(sensor);", "sensor.read();", "sensor.read;"], "answer": "C", "explanation": "非 static 方法必須以物件參考加上點運算子呼叫，並包含括號。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "instance-call"}, {"id": "u1-m5-14", "unit": 1, "type": "mcq", "set": 5, "topic": "String 不可變", "prompt": "What is printed?", "code": "String text = \"build\";\ntext.substring(1);\nSystem.out.print(text);", "options": ["b", "build", "uild", "BUILD"], "answer": "B", "explanation": "substring 回傳新字串；未把回傳值指定回 text，因此原參考不變。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "immutable"}, {"id": "u1-m5-15", "unit": 1, "type": "mcq", "set": 5, "topic": "參考與內容", "prompt": "What is printed?", "code": "String a = new String(\"TEST\");\nString b = new String(\"TEST\");\nSystem.out.print(a.equals(b) + \" \" + (a == b));", "options": ["false true", "true true", "false false", "true false"], "answer": "D", "explanation": "兩個 new 建立不同物件，所以 == 為 false；內容相同，equals 為 true。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "equals-reference"}, {"id": "u1-m5-16", "unit": 1, "type": "mcq", "set": 5, "topic": "整數截斷", "prompt": "What is printed?", "code": "double value = 35.9;\nint n = (int) value;\nSystem.out.print(n);", "options": ["35.9", "35", "34", "36"], "answer": "B", "explanation": "轉為 int 會朝 0 截斷小數，所以得到 35。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "narrowing"}, {"id": "u2-m5-01", "unit": 2, "type": "mcq", "set": 5, "topic": "獨立 if", "prompt": "What is printed?", "code": "int x = 9;\nif (x \u003e 3) { x += 2; }\nif (x \u003e 10) { x *= 2; }\nSystem.out.print(x);", "options": ["18", "9", "22", "11"], "answer": "C", "explanation": "第一個 if 把 x 變為 11；第二個條件也成立，再乘 2 得 22。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "independent-if"}, {"id": "u2-m5-02", "unit": 2, "type": "mcq", "set": 5, "topic": "互斥分支", "prompt": "What is printed?", "code": "int score = 95;\nif (score \u003e= 90) { System.out.print(\"A\"); }\nelse if (score \u003e= 80) { System.out.print(\"B\"); }\nelse if (score \u003e= 60) { System.out.print(\"C\"); }\nelse { System.out.print(\"D\"); }", "options": ["D", "C", "B", "A"], "answer": "D", "explanation": "95 分選中 A 分支，else-if 鏈只執行第一個成立分支。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "else-if"}, {"id": "u2-m5-03", "unit": 2, "type": "mcq", "set": 5, "topic": "巢狀條件", "prompt": "What is the final value of x?", "code": "int x = 7;\nint y = 8;\nif (x \u003c y) {\n    if (y \u003e 0) { x += 3; }\n    else { x -= 3; }\n}", "options": ["4", "10", "8", "7"], "answer": "B", "explanation": "x \u003c y 且 y \u003e 0，進入內層 if，x 增加 3 得 10。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "nested-if"}, {"id": "u2-m5-04", "unit": 2, "type": "mcq", "set": 5, "topic": "for 次數", "prompt": "How many times is X printed?", "code": "for (int k = 1; k \u003c 12; k += 2) {\n    System.out.print(\"X\");\n}", "options": ["12", "7", "5", "6"], "answer": "D", "explanation": "k 依序為 1, 3, 5, 7, 9, 11，共 6 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "for-count"}, {"id": "u2-m5-05", "unit": 2, "type": "mcq", "set": 5, "topic": "while 次數", "prompt": "How many times is A printed?", "code": "int n = 1;\nwhile (n \u003c 15) {\n    System.out.print(\"A\");\n    n += 3;\n}", "options": ["15", "5", "6", "4"], "answer": "B", "explanation": "n 從 1 每次加 3，在到達或超過 15 前共執行 5 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "while-count"}, {"id": "u2-m5-06", "unit": 2, "type": "mcq", "set": 5, "topic": "巢狀迴圈", "prompt": "How many times is hop printed?", "code": "for (int i = 0; i \u003c 7; i++) {\n    for (int j = 0; j \u003c 8; j++) {\n        System.out.println(\"hop\");\n    }\n}", "options": ["48", "57", "15", "56"], "answer": "D", "explanation": "外層 7 次，每次內層 8 次，共 56 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "nested-count"}, {"id": "u2-m5-07", "unit": 2, "type": "mcq", "set": 5, "topic": "邊界差異", "prompt": "Changing i \u003c 8 to i \u003c= 8 has what effect?", "code": "for (int i = 0; i \u003c 8; i++) {\n    System.out.print(i);\n}", "options": ["One additional loop iteration.", "An infinite loop.", "No change.", "One fewer loop iteration."], "answer": "A", "explanation": "原本 i 是 0 到 7；修改後會多執行 i == 8 的一次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "inclusive-bound"}, {"id": "u2-m5-08", "unit": 2, "type": "mcq", "set": 5, "topic": "短路保護", "prompt": "Which expression is safe for every int x, including zero?", "code": "int y = 50;", "options": ["(x != 0) || (y / x \u003e 1)", "(y / x \u003e 1) \u0026\u0026 (x != 0)", "(y / x \u003e 1) || (x == 0)", "(x != 0) \u0026\u0026 (y / x \u003e 1)"], "answer": "D", "explanation": "\u0026\u0026 先判斷 x != 0；當為 false 時右側除法不執行。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "short-circuit"}, {"id": "u2-m5-09", "unit": 2, "type": "mcq", "set": 5, "topic": "De Morgan", "prompt": "Which expression is equivalent to !(x \u003c 5 || x \u003e 15)?", "code": "", "options": ["x \u003e= 5 || x \u003c= 15", "x \u003c= 5 \u0026\u0026 x \u003e= 15", "x \u003c 5 \u0026\u0026 x \u003e 15", "x \u003e= 5 \u0026\u0026 x \u003c= 15"], "answer": "D", "explanation": "否定 OR 改成 AND，並將每個比較條件取反；邊界需包含等號。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "demorgan"}, {"id": "u2-m5-10", "unit": 2, "type": "mcq", "set": 5, "topic": "範圍條件", "prompt": "Which condition is true exactly when x is between 25 and 35, inclusive?", "code": "", "options": ["x \u003e= 25 || x \u003c= 35", "x \u003e 25 \u0026\u0026 x \u003c 35", "x \u003c= 25 \u0026\u0026 x \u003e= 35", "x \u003e= 25 \u0026\u0026 x \u003c= 35"], "answer": "D", "explanation": "「介於兩端且包含端點」使用 \u003e=、\u003c= 與 \u0026\u0026。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "range"}, {"id": "u2-m5-11", "unit": 2, "type": "mcq", "set": 5, "topic": "條件加總", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 0; k \u003c 11; k++) {\n    if (k % 2 == 0) { sum += k; }\n}\nSystem.out.print(sum);", "options": ["30", "0", "32", "31"], "answer": "A", "explanation": "只加總小於 11 的非負偶數，總和為 30。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "even-sum"}, {"id": "u2-m5-12", "unit": 2, "type": "mcq", "set": 5, "topic": "數字演算法", "prompt": "What is printed?", "code": "int n = 185;\nint result = 0;\nwhile (n \u003e 0) {\n    result = result * 10 + n % 10;\n    n /= 10;\n}\nSystem.out.print(result);", "options": ["581", "591", "185", "14"], "answer": "A", "explanation": "每次取出最後一位並接在 result 右側，將 185 的數字反轉為 581。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reverse-digits"}, {"id": "u2-m5-13", "unit": 2, "type": "mcq", "set": 5, "topic": "累加器", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 1; k \u003c= 8; k++) { sum += k; }\nSystem.out.print(sum);", "options": ["36", "8", "44", "35"], "answer": "A", "explanation": "加總 1 到 8，結果為 8 × 9 / 2 = 36。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "sum"}, {"id": "u2-m5-14", "unit": 2, "type": "mcq", "set": 5, "topic": "字串走訪", "prompt": "What is printed?", "code": "String text = \"anaconda\";\nint count = 0;\nfor (int k = 0; k \u003c text.length(); k++) {\n    if (text.substring(k, k + 1).equals(\"a\")) { count++; }\n}\nSystem.out.print(count);", "options": ["2", "4", "3", "8"], "answer": "C", "explanation": "逐一擷取字元並計算 a，\"anaconda\" 中共有 3 個 a。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "string-count"}, {"id": "u2-m5-15", "unit": 2, "type": "mcq", "set": 5, "topic": "最後出現位置", "prompt": "What is printed?", "code": "String text = \"anaconda\";\nint last = -1;\nfor (int k = 0; k \u003c text.length(); k++) {\n    if (text.substring(k, k + 1).equals(\"a\")) { last = k; }\n}\nSystem.out.print(last);", "options": ["8", "0", "7", "-1"], "answer": "C", "explanation": "每次找到 a 就覆寫 last，最後保留最右側 a 的索引 7。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "last-index"}, {"id": "u2-m5-16", "unit": 2, "type": "mcq", "set": 5, "topic": "三角形迴圈", "prompt": "How many stars are printed in total?", "code": "for (int row = 1; row \u003c= 8; row++) {\n    for (int col = 0; col \u003c row; col++) {\n        System.out.print(\"*\");\n    }\n}", "options": ["36", "8", "44", "64"], "answer": "A", "explanation": "每列印出 1、2、…、8 個星號，總共 36 個。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "triangle"}, {"id": "u3-m5-01", "unit": 3, "type": "mcq", "set": 5, "topic": "建構子初始化", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int start) { value = start; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox box = new Box(8);\nSystem.out.print(box.getValue());", "options": ["8", "0", "-1", "9"], "answer": "A", "explanation": "建構子把參數 8 保存到 value，getter 回傳 8。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor"}, {"id": "u3-m5-02", "unit": 3, "type": "mcq", "set": 5, "topic": "參數遮蔽", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int value) { value = value; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nSystem.out.print(new Box(8).getValue());", "options": ["0", "8", "-1", "1"], "answer": "A", "explanation": "value = value 只把參數指定給自己，未更新實例欄位；int 欄位仍為預設值 0。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "shadowing"}, {"id": "u3-m5-03", "unit": 3, "type": "mcq", "set": 5, "topic": "Getter", "prompt": "Which method returns the private instance field points?", "code": "private int points = 8;", "options": ["public int getPoints() { return points; }", "public int getPoints(int points) { return 0; }", "public int getPoints() { return \"points\"; }", "public void getPoints() { return points; }"], "answer": "A", "explanation": "Getter 的回傳型別為 int，回傳欄位 points，且不需要輸入參數。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "getter"}, {"id": "u3-m5-04", "unit": 3, "type": "mcq", "set": 5, "topic": "Setter", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int v) { value = v; }\n    public void setValue(int v) { value = v; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox b = new Box(8);\nb.setValue(18);\nSystem.out.print(b.getValue());", "options": ["8", "0", "19", "18"], "answer": "D", "explanation": "setValue 以新值 18 替換原本的 8。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "setter"}, {"id": "u3-m5-05", "unit": 3, "type": "mcq", "set": 5, "topic": "回傳型別", "prompt": "Which declaration correctly returns the result of 8.0 / 2?", "code": "", "options": ["public double half() { return 8.0 / 2; }", "public boolean half() { return 8.0 / 2; }", "public int half() { return 8.0 / 2; }", "public void half() { return 8.0 / 2; }"], "answer": "A", "explanation": "double 運算結果需由相容的回傳型別傳回；int 不可隱含接收 double。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "return-type"}, {"id": "u3-m5-06", "unit": 3, "type": "mcq", "set": 5, "topic": "基本型別傳值", "prompt": "What is printed?", "code": "// In the same class:\npublic static void change(int x) { x += 10; }\n// In main:\nint n = 8;\nchange(n);\nSystem.out.print(n);", "options": ["18", "0", "8", "28"], "answer": "C", "explanation": "參數 x 是呼叫時 n 的值的複本；修改 x 不會修改外部 n。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "primitive-parameter"}, {"id": "u3-m5-07", "unit": 3, "type": "mcq", "set": 5, "topic": "物件參數", "prompt": "Assume Box has an int field value and a public setValue/getValue pair. What is printed?", "code": "public static void change(Box b) { b.setValue(18); }\n// In main:\nBox item = new Box(8);\nchange(item);\nSystem.out.print(item.getValue());", "options": ["19", "8", "0", "18"], "answer": "D", "explanation": "傳遞的是參考值的複本，但仍指向同一個物件；修改欄位可由呼叫端觀察到。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reference-parameter"}, {"id": "u3-m5-08", "unit": 3, "type": "mcq", "set": 5, "topic": "參考別名", "prompt": "Assume Counter(start) sets count, add(n) increases count, and getCount() returns count. What is printed?", "code": "Counter a = new Counter(8);\nCounter b = a;\nb.add(10);\nSystem.out.print(a.getCount());", "options": ["19", "18", "8", "28"], "answer": "B", "explanation": "a 與 b 指向同一個 Counter，因此透過 b 更新後，a 也看得到。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "aliasing"}, {"id": "u3-m5-09", "unit": 3, "type": "mcq", "set": 5, "topic": "static 欄位", "prompt": "What is printed? Assume no Item was created earlier.", "code": "class Item {\n    private static int total = 0;\n    public Item() { total++; }\n    public static int getTotal() { return total; }\n}\n// In a separate method:\nnew Item();\nnew Item();\nnew Item();\nnew Item();\nnew Item();\nnew Item();\nSystem.out.print(Item.getTotal());", "options": ["5", "0", "7", "6"], "answer": "D", "explanation": "static total 由所有實例共享，每次 new 增加 1，共建立 6 個。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "static-state"}, {"id": "u3-m5-10", "unit": 3, "type": "mcq", "set": 5, "topic": "獨立實例", "prompt": "Assume Counter(start), add(n), and getCount() behave as their names indicate. What is printed?", "code": "Counter a = new Counter(8);\nCounter b = new Counter(8);\na.add(10);\nSystem.out.print(b.getCount());", "options": ["28", "8", "18", "0"], "answer": "B", "explanation": "兩次 new 建立不同物件；更新 a 不會更新 b 的實例欄位。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "separate-instances"}, {"id": "u3-m5-11", "unit": 3, "type": "mcq", "set": 5, "topic": "建構子多載", "prompt": "Which additional constructor is valid in this class?", "code": "public class Point {\n    private int x;\n    public Point() { x = 0; }\n    // additional constructor\n}", "options": ["public void Point(int value) { x = value; }", "public point(int value) { x = value; }", "public Point(int value) { x = value; }", "public Point() { x = 1; }"], "answer": "C", "explanation": "建構子名稱須為 Point、不能有回傳型別；參數列表不同才能多載。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor-overload"}, {"id": "u3-m5-12", "unit": 3, "type": "mcq", "set": 5, "topic": "方法多載", "prompt": "Which method can be added without a duplicate-signature error?", "code": "public int scale(int value) { return value * 6; }", "options": ["public int scale(int number) { return number + 1; }", "public double scale(double value) { return value * 2; }", "private int scale(int value) { return value; }", "public double scale(int value) { return value * 2.0; }"], "answer": "B", "explanation": "不同參數型別 double 可形成多載；只改回傳型別、參數名稱或存取權限都不行。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-overload"}, {"id": "u3-m5-13", "unit": 3, "type": "mcq", "set": 5, "topic": "封裝", "prompt": "A separate class has a Box object b. Which statement about accessing its state is correct?", "code": "public class Box {\n    private int value = 8;\n    public int getValue() { return value; }\n}", "options": ["b.getValue() is allowed, but b.value is not.", "Both b.getValue() and b.value are allowed.", "Neither access is allowed.", "b.value is allowed, but b.getValue() is not."], "answer": "A", "explanation": "private 欄位不能由不同類別直接讀取，public getter 則可。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "visibility"}, {"id": "u3-m5-14", "unit": 3, "type": "mcq", "set": 5, "topic": "組合關係", "prompt": "Book.getPages() returns its page count. Which expression in Shelf.total() gets the stored book’s pages?", "code": "public class Shelf {\n    private Book current;\n    public Shelf(Book b) { current = b; }\n    public int total() { return /* missing */; }\n}", "options": ["getPages(current)", "current.getPages()", "current.pages", "Book.getPages()"], "answer": "B", "explanation": "current 是 Shelf 保存的 Book 物件，透過它呼叫公開的實例方法。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "composition"}, {"id": "u3-m5-15", "unit": 3, "type": "mcq", "set": 5, "topic": "參考重新指定", "prompt": "Assume Box(int), setValue(int), and getValue() work normally. What is printed?", "code": "Box a = new Box(8);\nBox b = a;\nb = new Box(18);\nb.setValue(19);\nSystem.out.print(a.getValue());", "options": ["18", "19", "0", "8"], "answer": "D", "explanation": "b 被重新指定到新物件，a 仍指向原本值為 8 的物件。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reassignment"}, {"id": "u3-m5-16", "unit": 3, "type": "mcq", "set": 5, "topic": "方法呼叫順序", "prompt": "Assume Counter(start), add(n), and getCount() work normally. What is printed?", "code": "Counter c = new Counter(8);\nc.add(10);\nc.add(c.getCount());\nSystem.out.print(c.getCount());", "options": ["36", "37", "35", "18"], "answer": "A", "explanation": "第一次 add 後為 18；第二次再加上目前值 18，得到 36。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "call-order"}, {"id": "u4-m5-01", "unit": 4, "type": "mcq", "set": 5, "topic": "陣列索引", "prompt": "What is printed?", "code": "int[] a = {7, 10, 13, 16};\nSystem.out.print(a[2]);", "options": ["0", "13", "16", "-1"], "answer": "B", "explanation": "索引從 0 開始，a[2] 是第 3 個元素 13。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-index"}, {"id": "u4-m5-02", "unit": 4, "type": "mcq", "set": 5, "topic": "預設元素", "prompt": "What is printed?", "code": "int[] a = new int[8];\nSystem.out.print(a[5]);", "options": ["-1", "0", "8", "5"], "answer": "B", "explanation": "int 陣列建立後每個元素預設為 0。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-default"}, {"id": "u4-m5-03", "unit": 4, "type": "mcq", "set": 5, "topic": "元素更新", "prompt": "What is printed?", "code": "int[] a = {7, 10, 13, 16};\na[1] += a[0];\nSystem.out.print(a[1]);", "options": ["17", "7", "46", "10"], "answer": "A", "explanation": "把 a[0] 的 7 加到 a[1] 的 10，得到 17。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-update"}, {"id": "u4-m5-04", "unit": 4, "type": "mcq", "set": 5, "topic": "增強型 for", "prompt": "What is printed?", "code": "int[] a = {7, 10, 13, 16};\nfor (int value : a) { value += 10; }\nSystem.out.print(a[0]);", "options": ["10", "46", "7", "17"], "answer": "C", "explanation": "int value 是目前元素值的複本；修改這個區域變數不會更新陣列元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "enhanced-for"}, {"id": "u4-m5-05", "unit": 4, "type": "mcq", "set": 5, "topic": "陣列別名", "prompt": "What is printed?", "code": "int[] a = {7, 10, 13, 16};\nint[] b = a;\nb[0] = 25;\nSystem.out.print(a[0]);", "options": ["16", "0", "25", "7"], "answer": "C", "explanation": "a 與 b 指向同一個陣列，透過 b 修改元素也會由 a 觀察到。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-alias"}, {"id": "u4-m5-06", "unit": 4, "type": "mcq", "set": 5, "topic": "反向走訪", "prompt": "What is printed, ignoring the trailing space?", "code": "int[] a = {7, 10, 13, 16};\nfor (int k = a.length - 1; k \u003e= 0; k--) {\n    System.out.print(a[k] + \" \");\n}", "options": ["13 10 7", "7 10 13 16", "16 13 10", "16 13 10 7"], "answer": "D", "explanation": "從最後索引 length − 1 遞減到 0，順序完全反轉。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reverse-array"}, {"id": "u4-m5-07", "unit": 4, "type": "mcq", "set": 5, "topic": "最大值初始化", "prompt": "What is printed?", "code": "int[] a = {-13, -7, -10};\nint max = a[0];\nfor (int value : a) {\n    if (value \u003e max) { max = value; }\n}\nSystem.out.print(max);", "options": ["-7", "0", "-13", "-30"], "answer": "A", "explanation": "以第一個元素初始化可正確處理負數，最大值是 -7。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "negative-max"}, {"id": "u4-m5-08", "unit": 4, "type": "mcq", "set": 5, "topic": "線性搜尋", "prompt": "What is printed?", "code": "int[] a = {7, 10, 13, 16};\nint found = -1;\nfor (int k = 0; k \u003c a.length; k++) {\n    if (a[k] == 13) { found = k; }\n}\nSystem.out.print(found);", "options": ["2", "3", "13", "-1"], "answer": "A", "explanation": "目標 13 位於索引 2，found 更新為 2。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "linear-search"}, {"id": "u4-m5-09", "unit": 4, "type": "mcq", "set": 5, "topic": "ArrayList 插入", "prompt": "What is printed? Assume java.util.ArrayList is imported.", "code": "ArrayList\u003cString\u003e list = new ArrayList\u003cString\u003e();\nlist.add(\"A\");\nlist.add(\"B\");\nlist.add(1, \"Q\");\nSystem.out.print(list);", "options": ["[A, Q, B]", "[A, Q]", "[A, B, Q]", "[Q, A, B]"], "answer": "A", "explanation": "add(1, element) 在索引 1 插入，原本 B 向右移。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-insert"}, {"id": "u4-m5-10", "unit": 4, "type": "mcq", "set": 5, "topic": "ArrayList 移除", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cInteger\u003e nums = new ArrayList\u003cInteger\u003e();\nnums.add(6);\nnums.add(9);\nnums.add(12);\nnums.remove(1);\nSystem.out.print(nums);", "options": ["[9, 12]", "[6, 9, 12]", "[6, 9]", "[6, 12]"], "answer": "D", "explanation": "remove(1) 使用 int 參數，移除索引 1 的元素，不是移除值為 1 的元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-remove"}, {"id": "u4-m5-11", "unit": 4, "type": "mcq", "set": 5, "topic": "ArrayList.set", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cString\u003e words = new ArrayList\u003cString\u003e();\nwords.add(\"A\");\nwords.add(\"B\");\nString old = words.set(0, \"Q\");\nSystem.out.print(old + \" \" + words.size());", "options": ["A 3", "Q 2", "Q 3", "A 2"], "answer": "D", "explanation": "set 替換索引 0 的元素並回傳舊值 A；串列大小仍為 2。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-set"}, {"id": "u4-m5-12", "unit": 4, "type": "mcq", "set": 5, "topic": "二維索引", "prompt": "What is printed?", "code": "int[][] grid = {{5, 6, 7}, {8, 9, 10}};\nSystem.out.print(grid[1][2]);", "options": ["0", "10", "20", "-1"], "answer": "B", "explanation": "先定位列索引 1，再定位欄索引 2，得到 10。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "matrix-index"}, {"id": "u4-m5-13", "unit": 4, "type": "mcq", "set": 5, "topic": "二維長度", "prompt": "What is printed?", "code": "int[][] grid = new int[3][8];\nSystem.out.print(grid.length + \" \" + grid[0].length);", "options": ["3 8", "8 3", "3 24", "24 8"], "answer": "A", "explanation": "grid.length 是列數 3，grid[0].length 是第 0 列欄數。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "matrix-length"}, {"id": "u4-m5-14", "unit": 4, "type": "mcq", "set": 5, "topic": "逐欄加總", "prompt": "What is printed?", "code": "int[][] grid = {{5, 6}, {7, 8}, {9, 10}};\nint sum = 0;\nfor (int row = 0; row \u003c grid.length; row++) {\n    sum += grid[row][1];\n}\nSystem.out.print(sum);", "options": ["0", "24", "45", "11"], "answer": "B", "explanation": "固定欄索引 1，加總 6、8、10，得到 24。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "column-sum"}, {"id": "u4-m5-15", "unit": 4, "type": "mcq", "set": 5, "topic": "遞迴追蹤", "prompt": "What is returned by sum(7)?", "code": "public static int sum(int n) {\n    if (n == 0) { return 0; }\n    return n + sum(n - 1);\n}", "options": ["29", "7", "49", "28"], "answer": "D", "explanation": "遞迴展開後是 7 + 6 + 5 + 4 + 3 + 2 + 1 + 0 = 28。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "recursion"}, {"id": "u4-m5-16", "unit": 4, "type": "mcq", "set": 5, "topic": "選擇排序一回合", "prompt": "What does a contain after this first selection-sort pass?", "code": "int[] a = {13, 11, 8, 6};\nint min = 0;\nfor (int k = 1; k \u003c a.length; k++) {\n    if (a[k] \u003c a[min]) { min = k; }\n}\nint temp = a[0];\na[0] = a[min];\na[min] = temp;", "options": ["[13, 11, 8, 6]", "[6, 8, 11, 13]", "[6, 11, 8, 13]", "[11, 8, 6, 13]"], "answer": "C", "explanation": "找到最小值 6 的索引 3，與索引 0 交換，其他元素不變。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "selection-pass"}], "policy": {"inheritance": false, "persistence": false, "grading": "percent-correct"}};
const BANK=CONFIG.questions,UNITS=CONFIG.units,byId=new Map(BANK.map(q=>[q.id,q]));
let session=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){for(const x of ['home','unit','practice','results'])$(x).hidden=x!==id;window.scrollTo(0,0)}
function group(unit,type,set){return BANK.filter(q=>q.unit===unit&&q.type===type&&(set===undefined||q.set===set))}
function groups(unit,type){return [...new Set(group(unit,type).map(q=>q.set))].sort((a,b)=>a-b)}
function home(){show('home');$('home').innerHTML=`<div class="hero"><div><div class="eyebrow">A little practice, a clearer mind.</div><h1>一步一步，<br>把 Java 寫進直覺。</h1><p class="sub">選擇章節，從程式填空到選擇題。<br>讀懂每一行，也理解每一次判斷。</p></div><div class="hero-panel"><div class="hero-top"><span>YOUR NEXT SMALL WIN</span><span>JAVA</span></div><pre class="hero-code"><span class="code-accent">String</span> goal = "Understand, not memorize";\n<span class="code-accent">for</span> (int day = 0; day &lt; 7; day++) {\n    practice();\n    confidence++;\n}</pre></div></div><div class="section-head"><h2>選擇你的學習單元</h2><span class="small">4 個單元 · ${BANK.length} 題<br>每份練習獨立計分</span></div><div class="chapter-grid">${UNITS.map(u=>`<article class="chapter"><div class="chapter-top"><span>UNIT 0${u.id}</span><span>${group(u.id,'fill').length+group(u.id,'mcq').length} QUESTIONS</span></div><h3>${u.title}</h3><div class="small">${u.en}</div><p>${u.description}</p><div class="tags">${u.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="small" style="margin-bottom:20px">填空 ${groups(u.id,'fill').length} 份 · 選擇 ${groups(u.id,'mcq').length} 份</div><button class="btn primary full" data-unit="${u.id}">進入單元 →</button></article>`).join('')}</div>`;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>unitPage(Number(b.dataset.unit)))}
function unitPage(id){const u=UNITS.find(x=>x.id===id);show('unit');$('unit').innerHTML=`<button class="back" id="backHome">← 所有單元</button><div class="unit-heading"><div class="eyebrow">UNIT 0${id} · ${u.en}</div><h1>${u.title}</h1><p class="sub">${u.description}</p></div><div class="unit-summary">按題型選擇一份練習。填空每份 20 題、選擇每份 16 題；提交後立即顯示答案與解析，完成整份後顯示百分制成績。<br>填空保留 Java 大小寫與運算子差異；語意等價但未收錄的寫法不一定會被接受，請依提示填寫。</div><div class="section-head"><h2>01 · 程式填空</h2><span class="small">每份 20 題</span></div><div class="practice-grid">${groups(id,'fill').map(set=>`<article class="practice-card set-card"><div class="eyebrow">CODE COMPLETION</div><h3>填空題 · 第 ${set} 份</h3><p>${esc(u.sets[set-1]||'進階語法練習')}<br>填入關鍵字、型別、方法或運算子。</p><div class="meta-row"><span>${group(id,'fill',set).length} 題 · 每題 1 空</span><span>填寫後核對</span></div><button class="btn primary full" data-type="fill" data-set="${set}">開始這份練習 →</button></article>`).join('')}</div><div class="section-head section-space"><h2>02 · 選擇題</h2><span class="small">每份 16 題</span></div><div class="set-grid">${groups(id,'mcq').map(set=>{const topics=[...new Set(group(id,'mcq',set).map(q=>q.topic))];return `<article class="practice-card set-card"><div class="eyebrow">MULTIPLE CHOICE</div><div class="set-no">0${set}</div><h3>選擇題 · 第 ${set} 份</h3><p>${topics.slice(0,4).map(esc).join('、')}等主題。</p><div class="meta-row"><span>${group(id,'mcq',set).length} 題 · 四選一</span><span>即時答案與解析</span></div><button class="btn primary full" data-type="mcq" data-set="${set}">開始這份練習 →</button></article>`}).join('')}</div>`;$('backHome').onclick=home;document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const type=b.dataset.type,set=Number(b.dataset.set);start(group(id,type,set).map(q=>q.id),id,`Unit ${id} · ${type==='fill'?'填空題':'選擇題'}第 ${set} 份`)})}
function start(ids,unit,title){if(!ids.length)return;session={ids,unit,title,index:0,answers:{},drafts:{}};renderQuestion()}
// Token comparison preserves Java case, literal contents and operator boundaries.
function normalize(text){return (text.trim().match(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[A-Za-z_$][\w$]*|\d+(?:\.\d+)?|>>>|>>|<<|\+\+|--|&&|\|\||==|!=|<=|>=|\+=|-=|\*=|\/=|%=|\S/g)||[]).join('\u0000')}
function isFillCorrect(q,values){return values.length===q.answers.length&&values.every((v,i)=>q.answers[i].some(a=>normalize(v)===normalize(a)))}
function renderQuestion(){show('practice');const q=byId.get(session.ids[session.index]),a=session.answers[q.id],done=Object.keys(session.answers).length;const code=q.code?`<pre class="code" id="codeArea"></pre>`:'';$('practice').innerHTML=`<button class="back" id="leave">← 返回單元</button><div class="session-layout"><article class="question-card"><div class="question-meta"><span>${esc(session.title)}</span><span>${q.type==='fill'?'程式填空':'選擇題'} · ${session.index+1} / ${session.ids.length}</span></div><div class="eyebrow">${esc(q.topic)}</div><h2 id="prompt"></h2>${code}<div id="answerArea"></div><div id="feedback" role="status" aria-live="polite"></div><div class="source">${esc(q.source)}</div><div class="question-nav"><button class="btn" id="previous" ${session.index===0?'disabled':''}>← 上一題</button><button class="btn primary" id="next" ${a?'':'disabled'}>${session.index===session.ids.length-1?'查看本次成績':'下一題 →'}</button></div></article><aside class="rail"><h3>這一份的進度</h3><div class="small">已提交 ${done} / ${session.ids.length} 題</div><div class="progress-track"><div style="width:${100*done/session.ids.length}%"></div></div><div class="question-dots">${session.ids.map((id,i)=>{const r=session.answers[id];return `<span class="dot ${i===session.index?'now':''} ${r?(r.correct?'ok':'bad'):''}">${i+1}</span>`}).join('')}</div><p class="small">${q.type==='fill'?'填入空格後按「核對答案」。Java 大小寫會影響答案。':'點選一個選項，立即核對答案。'}<br>得分以整份練習的答對比例計算。</p></aside></div>`;$('prompt').textContent=q.prompt;if(q.type==='fill'){const pieces=q.code.split('___');const box=$('codeArea');pieces.forEach((piece,i)=>{box.append(document.createTextNode(piece));if(i<q.answers.length){const input=document.createElement('input');input.className='blank';input.setAttribute('aria-label',`第 ${i+1} 個空格`);input.autocomplete='off';input.autocapitalize='off';input.spellcheck=false;input.value=a?a.values[i]:(session.drafts[q.id]?.[i]||'');input.disabled=!!a;input.size=Math.min(18,Math.max(7,q.answers[i][0].length+2));if(a)input.classList.add(q.answers[i].some(ans=>normalize(ans)===normalize(a.values[i]))?'correct':'wrong');input.oninput=()=>{session.drafts[q.id]=[...document.querySelectorAll('.blank')].map(x=>x.value);};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submitFill()}};box.append(input)}});$('answerArea').innerHTML=`<button class="btn primary" id="check" ${a?'disabled':''}>核對答案</button><p class="small" id="inputHint">保留 Java 大小寫；忽略不影響語法的空格。</p>`;$('check').onclick=submitFill}else{if(q.code)$('codeArea').textContent=q.code;$('answerArea').innerHTML=`<div class="choices">${q.options.map((o,i)=>{const letter='ABCD'[i];let status='';if(a){if(letter===q.answer)status='selected-correct';else if(letter===a.value)status='selected-wrong'}return `<button class="choice ${status}" data-choice="${letter}" ${a?'disabled':''}><span class="letter">${letter}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>commit(q,{value:b.dataset.choice,correct:b.dataset.choice===q.answer}))}if(a){$('feedback').className=`feedback ${a.correct?'correct':'wrong'}`;const title=document.createElement('strong');title.textContent=a.correct?'✓ 答對了，繼續前進。':'這題再記一下，下次就會了。';const p=document.createElement('p');p.textContent=q.type==='fill'?`正確填法：${q.answers.map(x=>x.join(' 或 ')).join('；')}`:`正確答案：${q.answer} — ${q.options['ABCD'.indexOf(q.answer)]}`;const e=document.createElement('p');e.textContent=q.explanation;$('feedback').append(title,p,e)}$('leave').onclick=()=>unitPage(session.unit);$('previous').onclick=()=>{session.index--;renderQuestion()};$('next').onclick=()=>{if(!session.answers[q.id])return;if(session.index<session.ids.length-1){session.index++;renderQuestion()}else finish()}}
function submitFill(){const q=byId.get(session.ids[session.index]);if(session.answers[q.id])return;const values=[...document.querySelectorAll('.blank')].map(x=>x.value);if(values.some(v=>!v.trim())){$('inputHint').textContent='請先填寫所有空格，再核對答案。';document.querySelector('.blank:enabled')?.focus();return}commit(q,{values,correct:isFillCorrect(q,values)})}
function commit(q,answer){if(session.answers[q.id])return;session.answers[q.id]=answer;renderQuestion();$('feedback').scrollIntoView({block:'nearest',behavior:'smooth'})}

function answerText(q,a){return q.type==='fill'?a.values.join('；'):a.value+' — '+q.options['ABCD'.indexOf(a.value)]}
function finish(){if(Object.keys(session.answers).length!==session.ids.length)return;const correct=session.ids.filter(id=>session.answers[id].correct).length,wrong=session.ids.filter(id=>!session.answers[id].correct);show('results');$('results').innerHTML=`<div class="result-top"><div class="eyebrow">PRACTICE COMPLETE</div><h2>${esc(session.title)}</h2><div class="score">${Math.round(100*correct/session.ids.length)}<small> / 100</small></div><p class="sub" style="margin:0 auto 24px">答對 ${correct} 題 · 答錯 ${wrong.length} 題 · 共 ${session.ids.length} 題<br>得分 = ${correct} ÷ ${session.ids.length} × 100${100*correct/session.ids.length%1?'（四捨五入）':''}</p><div class="result-actions"><button class="btn primary" id="resultBack">返回單元</button><button class="btn" id="repeat">整份重新練習</button><button class="btn" id="allUnits">所有單元</button></div></div><div class="section-head"><h2>${wrong.length?'本次作答解析':'全部答對，這份已經掌握！'}</h2><span class="small">僅本次結果，不保存紀錄</span></div><div class="review-list">${wrong.map(id=>{const q=byId.get(id),a=session.answers[id];return `<article class="review-card"><div class="eyebrow">${esc(q.topic)}</div><h3>${esc(q.prompt)}</h3>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}<p>你的答案：${esc(answerText(q,a))}</p><p><strong>正確答案：${esc(q.type==='fill'?q.answers.map(x=>x.join(' 或 ')).join('；'):q.answer+' — '+q.options['ABCD'.indexOf(q.answer)])}</strong></p><p>${esc(q.explanation)}</p><div class="source">${esc(q.source)}</div></article>`}).join('')}</div>`;const previous=session;$('resultBack').onclick=()=>unitPage(previous.unit);$('repeat').onclick=()=>start(previous.ids,previous.unit,previous.title);$('allUnits').onclick=home}
home();

</script></body></html>
