, "10", "11", "0"], "answer": "B", "explanation": "每次找到 a 就覆寫 last，最後保留最右側 a 的索引 10。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "last-index"}, {"id": "u2-m3-16", "unit": 2, "type": "mcq", "set": 3, "topic": "三角形迴圈", "prompt": "How many stars are printed in total?", "code": "for (int row = 1; row \u003c= 6; row++) {\n    for (int col = 0; col \u003c row; col++) {\n        System.out.print(\"*\");\n    }\n}", "options": ["36", "21", "6", "27"], "answer": "B", "explanation": "每列印出 1、2、…、6 個星號，總共 21 個。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "triangle"}, {"id": "u3-m3-01", "unit": 3, "type": "mcq", "set": 3, "topic": "建構子初始化", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int start) { value = start; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox box = new Box(6);\nSystem.out.print(box.getValue());", "options": ["-1", "0", "6", "7"], "answer": "C", "explanation": "建構子把參數 6 保存到 value，getter 回傳 6。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor"}, {"id": "u3-m3-02", "unit": 3, "type": "mcq", "set": 3, "topic": "參數遮蔽", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int value) { value = value; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nSystem.out.print(new Box(6).getValue());", "options": ["6", "0", "1", "-1"], "answer": "B", "explanation": "value = value 只把參數指定給自己，未更新實例欄位；int 欄位仍為預設值 0。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "shadowing"}, {"id": "u3-m3-03", "unit": 3, "type": "mcq", "set": 3, "topic": "Getter", "prompt": "Which method returns the private instance field points?", "code": "private int points = 6;", "options": ["public int getPoints(int points) { return 0; }", "public void getPoints() { return points; }", "public int getPoints() { return \"points\"; }", "public int getPoints() { return points; }"], "answer": "D", "explanation": "Getter 的回傳型別為 int，回傳欄位 points，且不需要輸入參數。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "getter"}, {"id": "u3-m3-04", "unit": 3, "type": "mcq", "set": 3, "topic": "Setter", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int v) { value = v; }\n    public void setValue(int v) { value = v; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox b = new Box(6);\nb.setValue(12);\nSystem.out.print(b.getValue());", "options": ["6", "12", "0", "13"], "answer": "B", "explanation": "setValue 以新值 12 替換原本的 6。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "setter"}, {"id": "u3-m3-05", "unit": 3, "type": "mcq", "set": 3, "topic": "回傳型別", "prompt": "Which declaration correctly returns the result of 6.0 / 2?", "code": "", "options": ["public double half() { return 6.0 / 2; }", "public void half() { return 6.0 / 2; }", "public boolean half() { return 6.0 / 2; }", "public int half() { return 6.0 / 2; }"], "answer": "A", "explanation": "double 運算結果需由相容的回傳型別傳回；int 不可隱含接收 double。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "return-type"}, {"id": "u3-m3-06", "unit": 3, "type": "mcq", "set": 3, "topic": "基本型別傳值", "prompt": "What is printed?", "code": "// In the same class:\npublic static void change(int x) { x += 6; }\n// In main:\nint n = 6;\nchange(n);\nSystem.out.print(n);", "options": ["12", "18", "6", "0"], "answer": "C", "explanation": "參數 x 是呼叫時 n 的值的複本；修改 x 不會修改外部 n。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "primitive-parameter"}, {"id": "u3-m3-07", "unit": 3, "type": "mcq", "set": 3, "topic": "物件參數", "prompt": "Assume Box has an int field value and a public setValue/getValue pair. What is printed?", "code": "public static void change(Box b) { b.setValue(12); }\n// In main:\nBox item = new Box(6);\nchange(item);\nSystem.out.print(item.getValue());", "options": ["13", "0", "6", "12"], "answer": "D", "explanation": "傳遞的是參考值的複本，但仍指向同一個物件；修改欄位可由呼叫端觀察到。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reference-parameter"}, {"id": "u3-m3-08", "unit": 3, "type": "mcq", "set": 3, "topic": "參考別名", "prompt": "Assume Counter(start) sets count, add(n) increases count, and getCount() returns count. What is printed?", "code": "Counter a = new Counter(6);\nCounter b = a;\nb.add(6);\nSystem.out.print(a.getCount());", "options": ["12", "6", "13", "18"], "answer": "A", "explanation": "a 與 b 指向同一個 Counter，因此透過 b 更新後，a 也看得到。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "aliasing"}, {"id": "u3-m3-09", "unit": 3, "type": "mcq", "set": 3, "topic": "static 欄位", "prompt": "What is printed? Assume no Item was created earlier.", "code": "class Item {\n    private static int total = 0;\n    public Item() { total++; }\n    public static int getTotal() { return total; }\n}\n// In a separate method:\nnew Item();\nnew Item();\nnew Item();\nnew Item();\nSystem.out.print(Item.getTotal());", "options": ["0", "5", "4", "3"], "answer": "C", "explanation": "static total 由所有實例共享，每次 new 增加 1，共建立 4 個。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "static-state"}, {"id": "u3-m3-10", "unit": 3, "type": "mcq", "set": 3, "topic": "獨立實例", "prompt": "Assume Counter(start), add(n), and getCount() behave as their names indicate. What is printed?", "code": "Counter a = new Counter(6);\nCounter b = new Counter(6);\na.add(6);\nSystem.out.print(b.getCount());", "options": ["18", "6", "12", "0"], "answer": "B", "explanation": "兩次 new 建立不同物件；更新 a 不會更新 b 的實例欄位。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "separate-instances"}, {"id": "u3-m3-11", "unit": 3, "type": "mcq", "set": 3, "topic": "建構子多載", "prompt": "Which additional constructor is valid in this class?", "code": "public class Point {\n    private int x;\n    public Point() { x = 0; }\n    // additional constructor\n}", "options": ["public void Point(int value) { x = value; }", "public Point() { x = 1; }", "public Point(int value) { x = value; }", "public point(int value) { x = value; }"], "answer": "C", "explanation": "建構子名稱須為 Point、不能有回傳型別；參數列表不同才能多載。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor-overload"}, {"id": "u3-m3-12", "unit": 3, "type": "mcq", "set": 3, "topic": "方法多載", "prompt": "Which method can be added without a duplicate-signature error?", "code": "public int scale(int value) { return value * 4; }", "options": ["private int scale(int value) { return value; }", "public double scale(double value) { return value * 2; }", "public double scale(int value) { return value * 2.0; }", "public int scale(int number) { return number + 1; }"], "answer": "B", "explanation": "不同參數型別 double 可形成多載；只改回傳型別、參數名稱或存取權限都不行。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-overload"}, {"id": "u3-m3-13", "unit": 3, "type": "mcq", "set": 3, "topic": "封裝", "prompt": "A separate class has a Box object b. Which statement about accessing its state is correct?", "code": "public class Box {\n    private int value = 6;\n    public int getValue() { return value; }\n}", "options": ["Both b.getValue() and b.value are allowed.", "b.value is allowed, but b.getValue() is not.", "b.getValue() is allowed, but b.value is not.", "Neither access is allowed."], "answer": "C", "explanation": "private 欄位不能由不同類別直接讀取，public getter 則可。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "visibility"}, {"id": "u3-m3-14", "unit": 3, "type": "mcq", "set": 3, "topic": "組合關係", "prompt": "Book.getPages() returns its page count. Which expression in Shelf.total() gets the stored book’s pages?", "code": "public class Shelf {\n    private Book current;\n    public Shelf(Book b) { current = b; }\n    public int total() { return /* missing */; }\n}", "options": ["getPages(current)", "Book.getPages()", "current.getPages()", "current.pages"], "answer": "C", "explanation": "current 是 Shelf 保存的 Book 物件，透過它呼叫公開的實例方法。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "composition"}, {"id": "u3-m3-15", "unit": 3, "type": "mcq", "set": 3, "topic": "參考重新指定", "prompt": "Assume Box(int), setValue(int), and getValue() work normally. What is printed?", "code": "Box a = new Box(6);\nBox b = a;\nb = new Box(12);\nb.setValue(13);\nSystem.out.print(a.getValue());", "options": ["12", "6", "13", "0"], "answer": "B", "explanation": "b 被重新指定到新物件，a 仍指向原本值為 6 的物件。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reassignment"}, {"id": "u3-m3-16", "unit": 3, "type": "mcq", "set": 3, "topic": "方法呼叫順序", "prompt": "Assume Counter(start), add(n), and getCount() work normally. What is printed?", "code": "Counter c = new Counter(6);\nc.add(6);\nc.add(c.getCount());\nSystem.out.print(c.getCount());", "options": ["25", "12", "23", "24"], "answer": "D", "explanation": "第一次 add 後為 12；第二次再加上目前值 12，得到 24。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "call-order"}, {"id": "u4-m3-01", "unit": 4, "type": "mcq", "set": 3, "topic": "陣列索引", "prompt": "What is printed?", "code": "int[] a = {5, 8, 11, 14};\nSystem.out.print(a[0]);", "options": ["-1", "0", "5", "8"], "answer": "C", "explanation": "索引從 0 開始，a[0] 是第 1 個元素 5。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-index"}, {"id": "u4-m3-02", "unit": 4, "type": "mcq", "set": 3, "topic": "預設元素", "prompt": "What is printed?", "code": "int[] a = new int[6];\nSystem.out.print(a[3]);", "options": ["6", "-1", "0", "3"], "answer": "C", "explanation": "int 陣列建立後每個元素預設為 0。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-default"}, {"id": "u4-m3-03", "unit": 4, "type": "mcq", "set": 3, "topic": "元素更新", "prompt": "What is printed?", "code": "int[] a = {5, 8, 11, 14};\na[1] += a[0];\nSystem.out.print(a[1]);", "options": ["8", "13", "5", "38"], "answer": "B", "explanation": "把 a[0] 的 5 加到 a[1] 的 8，得到 13。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-update"}, {"id": "u4-m3-04", "unit": 4, "type": "mcq", "set": 3, "topic": "增強型 for", "prompt": "What is printed?", "code": "int[] a = {5, 8, 11, 14};\nfor (int value : a) { value += 10; }\nSystem.out.print(a[0]);", "options": ["10", "15", "5", "38"], "answer": "C", "explanation": "int value 是目前元素值的複本；修改這個區域變數不會更新陣列元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "enhanced-for"}, {"id": "u4-m3-05", "unit": 4, "type": "mcq", "set": 3, "topic": "陣列別名", "prompt": "What is printed?", "code": "int[] a = {5, 8, 11, 14};\nint[] b = a;\nb[0] = 23;\nSystem.out.print(a[0]);", "options": ["14", "0", "5", "23"], "answer": "D", "explanation": "a 與 b 指向同一個陣列，透過 b 修改元素也會由 a 觀察到。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-alias"}, {"id": "u4-m3-06", "unit": 4, "type": "mcq", "set": 3, "topic": "反向走訪", "prompt": "What is printed, ignoring the trailing space?", "code": "int[] a = {5, 8, 11, 14};\nfor (int k = a.length - 1; k \u003e= 0; k--) {\n    System.out.print(a[k] + \" \");\n}", "options": ["14 11 8 5", "5 8 11 14", "11 8 5", "14 11 8"], "answer": "A", "explanation": "從最後索引 length − 1 遞減到 0，順序完全反轉。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reverse-array"}, {"id": "u4-m3-07", "unit": 4, "type": "mcq", "set": 3, "topic": "最大值初始化", "prompt": "What is printed?", "code": "int[] a = {-11, -5, -8};\nint max = a[0];\nfor (int value : a) {\n    if (value \u003e max) { max = value; }\n}\nSystem.out.print(max);", "options": ["-11", "-24", "-5", "0"], "answer": "C", "explanation": "以第一個元素初始化可正確處理負數，最大值是 -5。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "negative-max"}, {"id": "u4-m3-08", "unit": 4, "type": "mcq", "set": 3, "topic": "線性搜尋", "prompt": "What is printed?", "code": "int[] a = {5, 8, 11, 14};\nint found = -1;\nfor (int k = 0; k \u003c a.length; k++) {\n    if (a[k] == 11) { found = k; }\n}\nSystem.out.print(found);", "options": ["-1", "3", "2", "11"], "answer": "C", "explanation": "目標 11 位於索引 2，found 更新為 2。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "linear-search"}, {"id": "u4-m3-09", "unit": 4, "type": "mcq", "set": 3, "topic": "ArrayList 插入", "prompt": "What is printed? Assume java.util.ArrayList is imported.", "code": "ArrayList\u003cString\u003e list = new ArrayList\u003cString\u003e();\nlist.add(\"A\");\nlist.add(\"B\");\nlist.add(1, \"Z\");\nSystem.out.print(list);", "options": ["[A, Z]", "[Z, A, B]", "[A, B, Z]", "[A, Z, B]"], "answer": "D", "explanation": "add(1, element) 在索引 1 插入，原本 B 向右移。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-insert"}, {"id": "u4-m3-10", "unit": 4, "type": "mcq", "set": 3, "topic": "ArrayList 移除", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cInteger\u003e nums = new ArrayList\u003cInteger\u003e();\nnums.add(4);\nnums.add(7);\nnums.add(10);\nnums.remove(1);\nSystem.out.print(nums);", "options": ["[7, 10]", "[4, 7]", "[4, 7, 10]", "[4, 10]"], "answer": "D", "explanation": "remove(1) 使用 int 參數，移除索引 1 的元素，不是移除值為 1 的元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-remove"}, {"id": "u4-m3-11", "unit": 4, "type": "mcq", "set": 3, "topic": "ArrayList.set", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cString\u003e words = new ArrayList\u003cString\u003e();\nwords.add(\"A\");\nwords.add(\"B\");\nString old = words.set(0, \"Z\");\nSystem.out.print(old + \" \" + words.size());", "options": ["Z 2", "A 2", "Z 3", "A 3"], "answer": "B", "explanation": "set 替換索引 0 的元素並回傳舊值 A；串列大小仍為 2。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-set"}, {"id": "u4-m3-12", "unit": 4, "type": "mcq", "set": 3, "topic": "二維索引", "prompt": "What is printed?", "code": "int[][] grid = {{3, 4, 5}, {6, 7, 8}};\nSystem.out.print(grid[1][0]);", "options": ["6", "-1", "0", "16"], "answer": "A", "explanation": "先定位列索引 1，再定位欄索引 0，得到 6。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "matrix-index"}, {"id": "u4-m3-13", "unit": 4, "type": "mcq", "set": 3, "topic": "二維長度", "prompt": "What is printed?", "code": "int[][] grid = new int[3][6];\nSystem.out.print(grid.length + \" \" + grid[0].length);", "options": ["3 18", "6 3", "3 6", "18 6"], "answer": "C", "explanation": "grid.length 是列數 3，grid[0].length 是第 0 列欄數。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "matrix-length"}, {"id": "u4-m3-14", "unit": 4, "type": "mcq", "set": 3, "topic": "逐欄加總", "prompt": "What is printed?", "code": "int[][] grid = {{3, 4}, {5, 6}, {7, 8}};\nint sum = 0;\nfor (int row = 0; row \u003c grid.length; row++) {\n    sum += grid[row][1];\n}\nSystem.out.print(sum);", "options": ["7", "0", "18", "33"], "answer": "C", "explanation": "固定欄索引 1，加總 4、6、8，得到 18。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "column-sum"}, {"id": "u4-m3-15", "unit": 4, "type": "mcq", "set": 3, "topic": "遞迴追蹤", "prompt": "What is returned by sum(5)?", "code": "public static int sum(int n) {\n    if (n == 0) { return 0; }\n    return n + sum(n - 1);\n}", "options": ["16", "5", "15", "25"], "answer": "C", "explanation": "遞迴展開後是 5 + 4 + 3 + 2 + 1 + 0 = 15。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "recursion"}, {"id": "u4-m3-16", "unit": 4, "type": "mcq", "set": 3, "topic": "選擇排序一回合", "prompt": "What does a contain after this first selection-sort pass?", "code": "int[] a = {11, 9, 6, 4};\nint min = 0;\nfor (int k = 1; k \u003c a.length; k++) {\n    if (a[k] \u003c a[min]) { min = k; }\n}\nint temp = a[0];\na[0] = a[min];\na[min] = temp;", "options": ["[4, 9, 6, 11]", "[9, 6, 4, 11]", "[11, 9, 6, 4]", "[4, 6, 9, 11]"], "answer": "A", "explanation": "找到最小值 4 的索引 3，與索引 0 交換，其他元素不變。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "selection-pass"}, {"id": "u1-m4-01", "unit": 1, "type": "mcq", "set": 4, "topic": "整數運算", "prompt": "What is printed?", "code": "int a = 8;\nint b = 15;\nSystem.out.print(a + b / 3 * 2);", "options": ["19", "20", "18", "16"], "answer": "C", "explanation": "整數除法 15 / 3 = 5，乘以 2 後加上 8，結果為 18。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "precedence"}, {"id": "u1-m4-02", "unit": 1, "type": "mcq", "set": 4, "topic": "型別轉換", "prompt": "What is the value of x?", "code": "double x = (double) 15 / 2;", "options": ["15.0", "17.0", "7.5", "7.0"], "answer": "C", "explanation": "先轉為 double，再除以 2，保留小數得到 7.5。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "cast-before-divide"}, {"id": "u1-m4-03", "unit": 1, "type": "mcq", "set": 4, "topic": "字串串接", "prompt": "What is printed?", "code": "System.out.print(\"N=\" + 6 + 7);", "options": ["13", "N=67", "N=13", "N=76"], "answer": "B", "explanation": "左邊已是字串，+ 由左至右進行串接，所以依序接上 6 與 7。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "concat"}, {"id": "u1-m4-04", "unit": 1, "type": "mcq", "set": 4, "topic": "substring", "prompt": "What is printed?", "code": "String word = \"VARIABLE\";\nSystem.out.print(word.substring(2, 5));", "options": ["RIAB", "RIA", "ARIA", "BLE"], "answer": "B", "explanation": "擷取索引 2 到 4，不含結束索引 5。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "substring"}, {"id": "u1-m4-05", "unit": 1, "type": "mcq", "set": 4, "topic": "String.length", "prompt": "What is the value of size?", "code": "String text = \"Code Today\";\nint size = text.length();", "options": ["0", "11", "9", "10"], "answer": "D", "explanation": "length() 計算全部字元，包含空格，共 10 個。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "length"}, {"id": "u1-m4-06", "unit": 1, "type": "mcq", "set": 4, "topic": "indexOf", "prompt": "What is printed?", "code": "String text = \"papaya\";\nSystem.out.print(text.indexOf(\"pa\"));", "options": ["6", "-1", "1", "0"], "answer": "D", "explanation": "第一次出現 \"pa\" 的索引為 0，索引從 0 開始。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "indexOf"}, {"id": "u1-m4-07", "unit": 1, "type": "mcq", "set": 4, "topic": "Math.abs", "prompt": "What is printed?", "code": "System.out.print(Math.abs(-16) + 4);", "options": ["12", "16", "-12", "20"], "answer": "D", "explanation": "絕對值為 16，再加 4 得到 20。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "abs"}, {"id": "u1-m4-08", "unit": 1, "type": "mcq", "set": 4, "topic": "Math.pow", "prompt": "What is the value of result?", "code": "double result = Math.pow(5, 3);", "options": ["130.0", "25.0", "125.0", "126.0"], "answer": "C", "explanation": "Math.pow(5, 3) 表示 5 的三次方，結果為 125.0。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "pow"}, {"id": "u1-m4-09", "unit": 1, "type": "mcq", "set": 4, "topic": "Math.sqrt", "prompt": "What is the value of result?", "code": "double result = Math.sqrt(49);", "options": ["6.0", "8.0", "7.0", "49.0"], "answer": "C", "explanation": "7 × 7 = 49，平方根為 7.0。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "sqrt"}, {"id": "u1-m4-10", "unit": 1, "type": "mcq", "set": 4, "topic": "Math.random", "prompt": "Which inclusive integer range can result?", "code": "int value = (int) (Math.random() * 8) + 6;", "options": ["6 through 14", "6 through 13", "0 through 8", "1 through 8"], "answer": "B", "explanation": "轉成 int 後為 0 到 7；加 6 後為 6 到 13。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "random-range"}, {"id": "u1-m4-11", "unit": 1, "type": "mcq", "set": 4, "topic": "參數型別", "prompt": "Assume double average(int total, int count) is defined. Which assignment compiles?", "code": "", "options": ["double result = average(true, 5);", "int result = average(40, 5);", "double result = average(40.5, 5);", "double result = average(40, 5);"], "answer": "D", "explanation": "方法要求兩個 int，並回傳 double；double 區域變數可接收結果。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-types"}, {"id": "u1-m4-12", "unit": 1, "type": "mcq", "set": 4, "topic": "例外判斷", "prompt": "Which value of y causes an ArithmeticException?", "code": "int x = 6 / y;", "options": ["6", "0", "1", "-1"], "answer": "B", "explanation": "int 除以 0 會造成 ArithmeticException。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "division-zero"}, {"id": "u1-m4-13", "unit": 1, "type": "mcq", "set": 4, "topic": "實例方法", "prompt": "Counter has a public non-static void method reset(). Object counter is initialized in another class. Which call is valid?", "code": "", "options": ["counter.reset();", "Counter.reset();", "counter.reset;", "reset(counter);"], "answer": "A", "explanation": "非 static 方法必須以物件參考加上點運算子呼叫，並包含括號。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "instance-call"}, {"id": "u1-m4-14", "unit": 1, "type": "mcq", "set": 4, "topic": "String 不可變", "prompt": "What is printed?", "code": "String text = \"study\";\ntext.substring(1);\nSystem.out.print(text);", "options": ["STUDY", "study", "s", "tudy"], "answer": "B", "explanation": "substring 回傳新字串；未把回傳值指定回 text，因此原參考不變。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "immutable"}, {"id": "u1-m4-15", "unit": 1, "type": "mcq", "set": 4, "topic": "參考與內容", "prompt": "What is printed?", "code": "String a = new String(\"LAB\");\nString b = new String(\"LAB\");\nSystem.out.print(a.equals(b) + \" \" + (a == b));", "options": ["true true", "false false", "false true", "true false"], "answer": "D", "explanation": "兩個 new 建立不同物件，所以 == 為 false；內容相同，equals 為 true。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "equals-reference"}, {"id": "u1-m4-16", "unit": 1, "type": "mcq", "set": 4, "topic": "整數截斷", "prompt": "What is printed?", "code": "double value = 32.9;\nint n = (int) value;\nSystem.out.print(n);", "options": ["32", "32.9", "31", "33"], "answer": "A", "explanation": "轉為 int 會朝 0 截斷小數，所以得到 32。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "narrowing"}, {"id": "u2-m4-01", "unit": 2, "type": "mcq", "set": 4, "topic": "獨立 if", "prompt": "What is printed?", "code": "int x = 8;\nif (x \u003e 3) { x += 2; }\nif (x \u003e 9) { x *= 2; }\nSystem.out.print(x);", "options": ["10", "16", "20", "8"], "answer": "C", "explanation": "第一個 if 把 x 變為 10；第二個條件也成立，再乘 2 得 20。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "independent-if"}, {"id": "u2-m4-02", "unit": 2, "type": "mcq", "set": 4, "topic": "互斥分支", "prompt": "What is printed?", "code": "int score = 85;\nif (score \u003e= 90) { System.out.print(\"A\"); }\nelse if (score \u003e= 80) { System.out.print(\"B\"); }\nelse if (score \u003e= 60) { System.out.print(\"C\"); }\nelse { System.out.print(\"D\"); }", "options": ["B", "C", "A", "D"], "answer": "A", "explanation": "85 分選中 B 分支，else-if 鏈只執行第一個成立分支。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "else-if"}, {"id": "u2-m4-03", "unit": 2, "type": "mcq", "set": 4, "topic": "巢狀條件", "prompt": "What is the final value of x?", "code": "int x = 6;\nint y = 7;\nif (x \u003c y) {\n    if (y \u003e 0) { x += 3; }\n    else { x -= 3; }\n}", "options": ["7", "9", "3", "6"], "answer": "B", "explanation": "x \u003c y 且 y \u003e 0，進入內層 if，x 增加 3 得 9。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "nested-if"}, {"id": "u2-m4-04", "unit": 2, "type": "mcq", "set": 4, "topic": "for 次數", "prompt": "How many times is X printed?", "code": "for (int k = 1; k \u003c 11; k += 2) {\n    System.out.print(\"X\");\n}", "options": ["5", "6", "11", "4"], "answer": "A", "explanation": "k 依序為 1, 3, 5, 7, 9，共 5 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "for-count"}, {"id": "u2-m4-05", "unit": 2, "type": "mcq", "set": 4, "topic": "while 次數", "prompt": "How many times is A printed?", "code": "int n = 1;\nwhile (n \u003c 13) {\n    System.out.print(\"A\");\n    n += 3;\n}", "options": ["4", "3", "13", "5"], "answer": "A", "explanation": "n 從 1 每次加 3，在到達或超過 13 前共執行 4 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "while-count"}, {"id": "u2-m4-06", "unit": 2, "type": "mcq", "set": 4, "topic": "巢狀迴圈", "prompt": "How many times is hop printed?", "code": "for (int i = 0; i \u003c 6; i++) {\n    for (int j = 0; j \u003c 7; j++) {\n        System.out.println(\"hop\");\n    }\n}", "options": ["13", "35", "42", "43"], "answer": "C", "explanation": "外層 6 次，每次內層 7 次，共 42 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "nested-count"}, {"id": "u2-m4-07", "unit": 2, "type": "mcq", "set": 4, "topic": "邊界差異", "prompt": "Changing i \u003c 7 to i \u003c= 7 has what effect?", "code": "for (int i = 0; i \u003c 7; i++) {\n    System.out.print(i);\n}", "options": ["One fewer loop iteration.", "One additional loop iteration.", "No change.", "An infinite loop."], "answer": "B", "explanation": "原本 i 是 0 到 6；修改後會多執行 i == 7 的一次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "inclusive-bound"}, {"id": "u2-m4-08", "unit": 2, "type": "mcq", "set": 4, "topic": "短路保護", "prompt": "Which expression is safe for every int x, including zero?", "code": "int y = 40;", "options": ["(x != 0) \u0026\u0026 (y / x \u003e 1)", "(y / x \u003e 1) || (x == 0)", "(x != 0) || (y / x \u003e 1)", "(y / x \u003e 1) \u0026\u0026 (x != 0)"], "answer": "A", "explanation": "\u0026\u0026 先判斷 x != 0；當為 false 時右側除法不執行。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "short-circuit"}, {"id": "u2-m4-09", "unit": 2, "type": "mcq", "set": 4, "topic": "De Morgan", "prompt": "Which expression is equivalent to !(x \u003c 4 || x \u003e 14)?", "code": "", "options": ["x \u003e= 4 \u0026\u0026 x \u003c= 14", "x \u003e= 4 || x \u003c= 14", "x \u003c 4 \u0026\u0026 x \u003e 14", "x \u003c= 4 \u0026\u0026 x \u003e= 14"], "answer": "A", "explanation": "否定 OR 改成 AND，並將每個比較條件取反；邊界需包含等號。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "demorgan"}, {"id": "u2-m4-10", "unit": 2, "type": "mcq", "set": 4, "topic": "範圍條件", "prompt": "Which condition is true exactly when x is between 20 and 30, inclusive?", "code": "", "options": ["x \u003e= 20 || x \u003c= 30", "x \u003e= 20 \u0026\u0026 x \u003c= 30", "x \u003c= 20 \u0026\u0026 x \u003e= 30", "x \u003e 20 \u0026\u0026 x \u003c 30"], "answer": "B", "explanation": "「介於兩端且包含端點」使用 \u003e=、\u003c= 與 \u0026\u0026。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "range"}, {"id": "u2-m4-11", "unit": 2, "type": "mcq", "set": 4, "topic": "條件加總", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 0; k \u003c 10; k++) {\n    if (k % 2 == 0) { sum += k; }\n}\nSystem.out.print(sum);", "options": ["20", "22", "21", "0"], "answer": "A", "explanation": "只加總小於 10 的非負偶數，總和為 20。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "even-sum"}, {"id": "u2-m4-12", "unit": 2, "type": "mcq", "set": 4, "topic": "數字演算法", "prompt": "What is printed?", "code": "int n = 172;\nint result = 0;\nwhile (n \u003e 0) {\n    result = result * 10 + n % 10;\n    n /= 10;\n}\nSystem.out.print(result);", "options": ["271", "10", "281", "172"], "answer": "A", "explanation": "每次取出最後一位並接在 result 右側，將 172 的數字反轉為 271。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reverse-digits"}, {"id": "u2-m4-13", "unit": 2, "type": "mcq", "set": 4, "topic": "累加器", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 1; k \u003c= 7; k++) { sum += k; }\nSystem.out.print(sum);", "options": ["35", "27", "7", "28"], "answer": "D", "explanation": "加總 1 到 7，結果為 7 × 8 / 2 = 28。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "sum"}, {"id": "u2-m4-14", "unit": 2, "type": "mcq", "set": 4, "topic": "字串走訪", "prompt": "What is printed?", "code": "String text = \"avocado\";\nint count = 0;\nfor (int k = 0; k \u003c text.length(); k++) {\n    if (text.substring(k, k + 1).equals(\"a\")) { count++; }\n}\nSystem.out.print(count);", "options": ["1", "3", "2", "7"], "answer": "C", "explanation": "逐一擷取字元並計算 a，\"avocado\" 中共有 2 個 a。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "string-count"}, {"id": "u2-m4-15", "unit": 2, "type": "mcq", "set": 4, "topic": "最後出現位置", "prompt": "What is printed?", "code": "String text = \"avocado\";\nint last = -1;\nfor (int k = 0; k \u003c text.length(); k++) {\n    if (text.substring(k, k + 1).equals(\"a\")) { last = k; }\n}\nSystem.out.print(last);", "options": ["4", "-1", "0", "5"], "answer": "A", "explanation": "每次找到 a 就覆寫 last，最後保留最右側 a 的索引 4。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "last-index"}, {"id": "u2-m4-16", "unit": 2, "type": "mcq", "set": 4, "topic": "三角形迴圈", "prompt": "How many stars are printed in total?", "code": "for (int row = 1; row \u003c= 7; row++) {\n    for (int col = 0; col \u003c row; col++) {\n        System.out.print(\"*\");\n    }\n}", "options": ["35", "49", "7", "28"], "answer": "D", "explanation": "每列印出 1、2、…、7 個星號，總共 28 個。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "triangle"}, {"id": "u3-m4-01", "unit": 3, "type": "mcq", "set": 4, "topic": "建構子初始化", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int start) { value = start; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox box = new Box(7);\nSystem.out.print(box.getValue());", "options": ["0", "-1", "8", "7"], "answer": "D", "explanation": "建構子把參數 7 保存到 value，getter 回傳 7。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor"}, {"id": "u3-m4-02", "unit": 3, "type": "mcq", "set": 4, "topic": "參數遮蔽", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int value) { value = value; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nSystem.out.print(new Box(7).getValue());", "options": ["1", "7", "0", "-1"], "answer": "C", "explanation": "value = value 只把參數指定給自己，未更新實例欄位；int 欄位仍為預設值 0。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "shadowing"}, {"id": "u3-m4-03", "unit": 3, "type": "mcq", "set": 4, "topic": "Getter", "prompt": "Which method returns the private instance field points?", "code": "private int points = 7;", "options": ["public int getPoints() { return \"points\"; }", "public int getPoints(int points) { return 0; }", "public void getPoints() { return points; }", "public int getPoints() { return points; }"], "answer": "D", "explanation": "Getter 的回傳型別為 int，回傳欄位 points，且不需要輸入參數。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "getter"}, {"id": "u3-m4-04", "unit": 3, "type": "mcq", "set": 4, "topic": "Setter", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int v) { value = v; }\n    public void setValue(int v) { value = v; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox b = new Box(7);\nb.setValue(15);\nSystem.out.print(b.getValue());", "options": ["16", "15", "0", "7"], "answer": "B", "explanation": "setValue 以新值 15 替換原本的 7。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "setter"}, {"id": "u3-m4-05", "unit": 3, "type": "mcq", "set": 4, "topic": "回傳型別", "prompt": "Which declaration correctly returns the result of 7.0 / 2?", "code": "", "options": ["public int half() { return 7.0 / 2; }", "public boolean half() { return 7.0 / 2; }", "public double half() { return 7.0 / 2; }", "public void half() { return 7.0 / 2; }"], "answer": "C", "explanation": "double 運算結果需由相容的回傳型別傳回；int 不可隱含接收 double。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "return-type"}, {"id": "u3-m4-06", "unit": 3, "type": "mcq", "set": 4, "topic": "基本型別傳值", "prompt": "What is printed?", "code": "// In the same class:\npublic static void change(int x) { x += 8; }\n// In main:\nint n = 7;\nchange(n);\nSystem.out.print(n);", "options": ["15", "7", "0", "23"], "answer": "B", "explanation": "參數 x 是呼叫時 n 的值的複本；修改 x 不會修改外部 n。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "primitive-parameter"}, {"id": "u3-m4-07", "unit": 3, "type": "mcq", "set": 4, "topic": "物件參數", "prompt": "Assume Box has an int field value and a public setValue/getValue pair. What is printed?", "code": "public static void change(Box b) { b.setValue(15); }\n// In main:\nBox item = new Box(7);\nchange(item);\nSystem.out.print(item.getValue());", "options": ["0", "16", "7", "15"], "answer": "D", "explanation": "傳遞的是參考值的複本，但仍指向同一個物件；修改欄位可由呼叫端觀察到。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reference-parameter"}, {"id": "u3-m4-08", "unit": 3, "type": "mcq", "set": 4, "topic": "參考別名", "prompt": "Assume Counter(start) sets count, add(n) increases count, and getCount() returns count. What is printed?", "code": "Counter a = new Counter(7);\nCounter b = a;\nb.add(8);\nSystem.out.print(a.getCount());", "options": ["7", "23", "15", "16"], "answer": "C", "explanation": "a 與 b 指向同一個 Counter，因此透過 b 更新後，a 也看得到。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "aliasing"}, {"id": "u3-m4-09", "unit": 3, "type": "mcq", "set": 4, "topic": "static 欄位", "prompt": "What is printed? Assume no Item was created earlier.", "code": "class Item {\n    private static int total = 0;\n    public Item() { total++; }\n    public static int getTotal() { return total; }\n}\n// In a separate method:\nnew Item();\nnew Item();\nnew Item();\nnew Item();\nnew Item();\nSystem.out.print(Item.getTotal());", "options": ["5", "0", "4", "6"], "answer": "A", "explanation": "static total 由所有實例共享，每次 new 增加 1，共建立 5 個。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "static-state"}, {"id": "u3-m4-10", "unit": 3, "type": "mcq", "set": 4, "topic": "獨立實例", "prompt": "Assume Counter(start), add(n), and getCount() behave as their names indicate. What is printed?", "code": "Counter a = new Counter(7);\nCounter b = new Counter(7);\na.add(8);\nSystem.out.print(b.getCount());", "options": ["7", "0", "15", "23"], "answer": "A", "explanation": "兩次 new 建立不同物件；更新 a 不會更新 b 的實例欄位。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "separate-instances"}, {"id": "u3-m4-11", "unit": 3, "type": "mcq", "set": 4, "topic": "建構子多載", "prompt": "Which additional constructor is valid in this class?", "code": "public class Point {\n    private int x;\n    public Point() { x = 0; }\n    // additional constructor\n}", "options": ["public Point() { x = 1; }", "public point(int value) { x = value; }", "public Point(int value) { x = value; }", "public void Point(int value) { x = value; }"], "answer": "C", "explanation": "建構子名稱須為 Point、不能有回傳型別；參數列表不同才能多載。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor-overload"}, {"id": "u3-m4-12", "unit": 3, "type": "mcq", "set": 4, "topic": "方法多載", "prompt": "Which method can be added without a duplicate-signature error?", "code": "public int scale(int value) { return value * 5; }", "options": ["public double scale(int value) { return value * 2.0; }", "private int scale(int value) { return value; }", "public int scale(int number) { return number + 1; }", "public double scale(double value) { return value * 2; }"], "answer": "D", "explanation": "不同參數型別 double 可形成多載；只改回傳型別、參數名稱或存取權限都不行。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-overload"}, {"id": "u3-m4-13", "unit": 3, "type": "mcq", "set": 4, "topic": "封裝", "prompt": "A separate class has a Box object b. Which statement about accessing its state is correct?", "code": "public class Box {\n    private int value = 7;\n    public int getValue() { return value; }\n}", "options": ["b.getValue() is allowed, but b.value is not.", "b.value is allowed, but b.getValue() is not.", "Neither access is allowed.", "Both b.getValue() and b.value are allowed."], "answer": "A", "explanation": "private 欄位不能由不同類別直接讀取，public getter 則可。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "visibility"}, {"id": "u3-m4-14", "unit": 3, "type": "mcq", "set": 4, "topic": "組合關係", "prompt": "Book.getPages() returns its page count. Which expression in Shelf.total() gets the stored book’s pages?", "code": "public class Shelf {\n    private Book current;\n    public Shelf(Book b) { current = b; }\n    public int total() { return /* missing */; }\n}", "options": ["current.getPages()", "getPages(current)", "current.pages", "Book.getPages()"], "answer": "A", "explanation": "current 是 Shelf 保存的 Book 物件，透過它呼叫公開的實例方法。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "composition"}, {"id": "u3-m4-15", "unit": 3, "type": "mcq", "set": 4, "topic": "參考重新指定", "prompt": "Assume Box(int), setValue(int), and getValue() work normally. What is printed?", "code": "Box a = new Box(7);\nBox b = a;\nb = new Box(15);\nb.setValue(16);\nSystem.out.print(a.getValue());", "options": ["15", "16", "7", "0"], "answer": "C", "explanation": "b 被重新指定到新物件，a 仍指向原本值為 7 的物件。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reassignment"}, {"id": "u3-m4-16", "unit": 3, "type": "mcq", "set": 4, "topic": "方法呼叫順序", "prompt": "Assume Counter(start), add(n), and getCount() work normally. What is printed?", "code": "Counter c = new Counter(7);\nc.add(8);\nc.add(c.getCount());\nSystem.out.print(c.getCount());", "options": ["30", "31", "15", "29"], "answer": "A", "explanation": "第一次 add 後為 15；第二次再加上目前值 15，得到 30。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "call-order"}, {"id": "u4-m4-01", "unit": 4, "type": "mcq", "set": 4, "topic": "陣列索引", "prompt": "What is printed?", "code": "int[] a = {6, 9, 12, 15};\nSystem.out.print(a[1]);", "options": ["9", "0", "12", "-1"], "answer": "A", "explanation": "索引從 0 開始，a[1] 是第 2 個元素 9。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-index"}, {"id": "u4-m4-02", "unit": 4, "type": "mcq", "set": 4, "topic": "預設元素", "prompt": "What is printed?", "code": "int[] a = new int[7];\nSystem.out.print(a[4]);", "options": ["4", "0", "7", "-1"], "answer": "B", "explanation": "int 陣列建立後每個元素預設為 0。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-default"}, {"id": "u4-m4-03", "unit": 4, "type": "mcq", "set": 4, "topic": "元素更新", "prompt": "What is printed?", "code": "int[] a = {6, 9, 12, 15};\na[1] += a[0];\nSystem.out.print(a[1]);", "options": ["42", "15", "6", "9"], "answer": "B", "explanation": "把 a[0] 的 6 加到 a[1] 的 9，得到 15。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-update"}, {"id": "u4-m4-04", "unit": 4, "type": "mcq", "set": 4, "topic": "增強型 for", "prompt": "What is printed?", "code": "int[] a = {6, 9, 12, 15};\nfor (int value : a) { value += 10; }\nSystem.out.print(a[0]);", "options": ["6", "16", "10", "42"], "answer": "A", "explanation": "int value 是目前元素值的複本；修改這個區域變數不會更新陣列元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "enhanced-for"}, {"id": "u4-m4-05", "unit": 4, "type": "mcq", "set": 4, "topic": "陣列別名", "prompt": "What is printed?", "code": "int[] a = {6, 9, 12, 15};\nint[] b = a;\nb[0] = 24;\nSystem.out.print(a[0]);", "options": ["6", "0", "15", "24"], "answer": "D", "explanation": "a 與 b 指向同一個陣列，透過 b 修改元素也會由 a 觀察到。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-alias"}, {"id": "u4-m4-06", "unit": 4, "type": "mcq", "set": 4, "topic": "反向走訪", "prompt": "What is printed, ignoring the trailing space?", "code": "int[] a = {6, 9, 12, 15};\nfor (int k = a.length - 1; k \u003e= 0; k--) {\n    System.out.print(a[k] + \" \");\n}", "options": ["12 9 6", "15 12 9", "15 12 9 6", "6 9 12 15"], "answer": "C", "explanation": "從最後索引 length − 1 遞減到 0，順序完全反轉。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reverse-array"}, {"id": "u4-m4-07", "unit": 4, "type": "mcq", "set": 4, "topic": "最大值初始化", "prompt": "What is printed?", "code": "int[] a = {-12, -6, -9};\nint max = a[0];\nfor (int value : a) {\n    if (value \u003e max) { max = value; }\n}\nSystem.out.print(max);", "options": ["-6", "-27", "0", "-12"], "answer": "A", "explanation": "以第一個元素初始化可正確處理負數，最大值是 -6。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "negative-max"}, {"id": "u4-m4-08", "unit": 4, "type": "mcq", "set": 4, "topic": "線性搜尋", "prompt": "What is printed?", "code": "int[] a = {6, 9, 12, 15};\nint found = -1;\nfor (int k = 0; k \u003c a.length; k++) {\n    if (a[k] == 12) { found = k; }\n}\nSystem.out.print(found);", "options": ["3", "-1", "12", "2"], "answer": "D", "explanation": "目標 12 位於索引 2，found 更新為 2。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "linear-search"}, {"id": "u4-m4-09", "unit": 4, "type": "mcq", "set": 4, "topic": "ArrayList 插入", "prompt": "What is printed? Assume java.util.ArrayList is imported.", "code": "ArrayList\u003cString\u003e list = new ArrayList\u003cString\u003e();\nlist.add(\"A\");\nlist.add(\"B\");\nlist.add(1, \"P\");\nSystem.out.print(list);", "options": ["[A, B, P]", "[A, P]", "[P, A, B]", "[A, P, B]"], "answer": "D", "explanation": "add(1, element) 在索引 1 插入，原本 B 向右移。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-insert"}, {"id": "u4-m4-10", "unit": 4, "type": "mcq", "set": 4, "topic": "ArrayList 移除", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cInteger\u003e nums = new ArrayList\u003cInteger\u003e();\nnums.add(5);\nnums.add(8);\nnums.add(11);\nnums.remove(1);\nSystem.out.print(nums);", "options": ["[5, 8, 11]", "[5, 11]", "[8, 11]", "[5, 8]"], "answer": "B", "explanation": "remove(1) 使用 int 參數，移除索引 1 的元素，不是移除值為 1 的元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-remove"}, {"id": "u4-m4-11", "unit": 4, "type": "mcq", "set":
