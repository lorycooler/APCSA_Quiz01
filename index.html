\nfor (int i = 0; i \u003c values.length; i++) {\n    copy[i] = values[___];\n}", "answers": [["i"]], "explanation": "建立新陣列並逐一複製元素，才能與原陣列獨立。", "source": "主題改編：CB Quiz 4-1 / 4-2（資料集合）；自編語法填空，非原題逐字轉錄", "provenance": "adapted"}, {"id": "u1-m1-01", "unit": 1, "type": "mcq", "topic": "整數運算", "prompt": "What is printed as a result of executing the code segment?", "code": "int a = 5;\nint b = 8;\nint c = 3;\nSystem.out.println(a + b / c * 2);", "options": ["2", "6", "8", "9"], "answer": "D", "explanation": "先做整數除法 8 / 3 = 2，再乘 2 得 4，最後加 5 得到 9。", "source": "CB SG_Quiz11 · 原題 1（文字重新排版）", "sourceKey": "SG_Quiz11", "sourceNumber": 1, "set": 1, "provenance": "original-reformatted"}, {"id": "u1-m1-02", "unit": 1, "type": "mcq", "topic": "運算優先順序", "prompt": "What is the value of x after executing the code segment?", "code": "int a = 1;\nint b = 2;\nint c = 3;\nint d = 4;\ndouble x = a + b * c % d;", "options": ["1.0", "2.5", "3.0", "7.0"], "answer": "C", "explanation": "2 * 3 = 6，6 % 4 = 2，1 + 2 = 3，再以 double 儲存為 3.0。", "source": "CB SG_Quiz11 · 原題 2（文字重新排版）", "sourceKey": "SG_Quiz11", "sourceNumber": 2, "set": 1, "provenance": "original-reformatted"}, {"id": "u1-m1-03", "unit": 1, "type": "mcq", "topic": "String.substring", "prompt": "What is printed as a result of executing the code segment?", "code": "String oldStr = \"ABCDEF\";\nString newStr = oldStr.substring(1, 3) + oldStr.substring(4);\nSystem.out.println(newStr);", "options": ["ABCD", "BCDE", "BCEF", "BCDEF"], "answer": "C", "explanation": "substring(1, 3) 為 BC，substring(4) 為 EF，串接後得到 BCEF。", "source": "CB SG_Quiz11 · 原題 3（文字重新排版）", "sourceKey": "SG_Quiz11", "sourceNumber": 3, "set": 1, "provenance": "original-reformatted"}, {"id": "u1-m1-04", "unit": 1, "type": "mcq", "topic": "實例方法", "prompt": "AnimalPrinter has public void printDog() and public void printCat(), which print \"dog\" and \"cat\" on separate lines. In another class, an AnimalPrinter object myPrinter has been properly initialized. Which code produces dog followed by cat?", "code": "", "options": ["printDog();\nprintCat();", "printDog(AnimalPrinter);\nprintCat(AnimalPrinter);", "AnimalPrinter.printDog();\nAnimalPrinter.printCat();", "myPrinter.printDog();\nmyPrinter.printCat();"], "answer": "D", "explanation": "這兩個方法是實例方法，需以物件 myPrinter 呼叫。", "source": "CB SG_Quiz11 · 原題 4（文字重新排版）", "sourceKey": "SG_Quiz11", "sourceNumber": 4, "set": 1, "provenance": "original-reformatted"}, {"id": "u1-m1-05", "unit": 1, "type": "mcq", "topic": "ArithmeticException", "prompt": "Which replacement for /* missing code */ causes an ArithmeticException?", "code": "int x = 10;\nint y = 20;\n/* missing code */\nSystem.out.print(top / bottom);\n\nI.   int top = x - y;\n     int bottom = y - x;\nII.  int top = 2 * x;\n     int bottom = y - top;\nIII. int top = x + y;\n     int bottom = 2 * top;", "options": ["I only", "II only", "III only", "II and III"], "answer": "B", "explanation": "只有 II 的 bottom = 20 − 20 = 0，整數除以 0 才會造成這個例外。", "source": "CB SG_Quiz11 · 原題 6（文字重新排版）", "sourceKey": "SG_Quiz11", "sourceNumber": 6, "set": 1, "provenance": "original-reformatted"}, {"id": "u1-m1-06", "unit": 1, "type": "mcq", "topic": "前置條件", "prompt": "Which precondition is most appropriate to avoid an ArithmeticException? Assume y is an int variable.", "code": "int x = 5 / y;\nSystem.out.println(x);", "options": ["y is equal to 0.", "y is less than 5.", "y is not equal to 0.", "y is not negative."], "answer": "C", "explanation": "整數除法的除數不可為 0；負數除數本身不會導致 ArithmeticException。", "source": "CB SG_Quiz11 · 原題 8（文字重新排版）", "sourceKey": "SG_Quiz11", "sourceNumber": 8, "set": 1, "provenance": "original-reformatted"}, {"id": "u1-m1-07", "unit": 1, "type": "mcq", "set": 1, "topic": "Math.abs", "prompt": "What is printed?", "code": "System.out.print(Math.abs(-7) + 1);", "options": ["7", "-6", "6", "8"], "answer": "D", "explanation": "絕對值為 7，再加 1 得到 8。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "abs"}, {"id": "u1-m1-08", "unit": 1, "type": "mcq", "set": 1, "topic": "Math.pow", "prompt": "What is the value of result?", "code": "double result = Math.pow(2, 3);", "options": ["10.0", "8.0", "4.0", "9.0"], "answer": "B", "explanation": "Math.pow(2, 3) 表示 2 的三次方，結果為 8.0。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "pow"}, {"id": "u1-m1-09", "unit": 1, "type": "mcq", "set": 1, "topic": "Math.sqrt", "prompt": "What is the value of result?", "code": "double result = Math.sqrt(16);", "options": ["4.0", "16.0", "5.0", "3.0"], "answer": "A", "explanation": "4 × 4 = 16，平方根為 4.0。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "sqrt"}, {"id": "u1-m1-10", "unit": 1, "type": "mcq", "set": 1, "topic": "Math.random", "prompt": "Which inclusive integer range can result?", "code": "int value = (int) (Math.random() * 5) + 3;", "options": ["3 through 7", "3 through 8", "0 through 5", "1 through 5"], "answer": "A", "explanation": "轉成 int 後為 0 到 4；加 3 後為 3 到 7。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "random-range"}, {"id": "u1-m1-11", "unit": 1, "type": "mcq", "set": 1, "topic": "參數型別", "prompt": "Assume double average(int total, int count) is defined. Which assignment compiles?", "code": "", "options": ["double result = average(10, 2);", "double result = average(10.5, 2);", "double result = average(true, 2);", "int result = average(10, 2);"], "answer": "A", "explanation": "方法要求兩個 int，並回傳 double；double 區域變數可接收結果。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-types"}, {"id": "u1-m1-12", "unit": 1, "type": "mcq", "set": 1, "topic": "例外判斷", "prompt": "Which value of y causes an ArithmeticException?", "code": "int x = 3 / y;", "options": ["1", "-1", "3", "0"], "answer": "D", "explanation": "int 除以 0 會造成 ArithmeticException。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "division-zero"}, {"id": "u1-m1-13", "unit": 1, "type": "mcq", "set": 1, "topic": "實例方法", "prompt": "Robot has a public non-static void method move(). Object robot is initialized in another class. Which call is valid?", "code": "", "options": ["robot.move();", "Robot.move();", "robot.move;", "move(robot);"], "answer": "A", "explanation": "非 static 方法必須以物件參考加上點運算子呼叫，並包含括號。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "instance-call"}, {"id": "u1-m1-14", "unit": 1, "type": "mcq", "set": 1, "topic": "String 不可變", "prompt": "What is printed?", "code": "String text = \"code\";\ntext.substring(1);\nSystem.out.print(text);", "options": ["CODE", "ode", "c", "code"], "answer": "D", "explanation": "substring 回傳新字串；未把回傳值指定回 text，因此原參考不變。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "immutable"}, {"id": "u1-m1-15", "unit": 1, "type": "mcq", "set": 1, "topic": "參考與內容", "prompt": "What is printed?", "code": "String a = new String(\"AP\");\nString b = new String(\"AP\");\nSystem.out.print(a.equals(b) + \" \" + (a == b));", "options": ["false false", "false true", "true false", "true true"], "answer": "C", "explanation": "兩個 new 建立不同物件，所以 == 為 false；內容相同，equals 為 true。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "equals-reference"}, {"id": "u1-m1-16", "unit": 1, "type": "mcq", "set": 1, "topic": "整數截斷", "prompt": "What is printed?", "code": "double value = 23.9;\nint n = (int) value;\nSystem.out.print(n);", "options": ["22", "24", "23.9", "23"], "answer": "D", "explanation": "轉為 int 會朝 0 截斷小數，所以得到 23。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "narrowing"}, {"id": "u2-m1-01", "unit": 2, "type": "mcq", "topic": "字串搜尋與迴圈", "prompt": "Assume check occurs at least once in str. Which best describes the value returned by what?", "code": "public static int what(String str, String check) {\n    int num = -1;\n    int len = check.length();\n    for (int k = 0; k + len \u003c= str.length(); k++) {\n        String a = str.substring(k, k + len);\n        if (a.equals(check)) {\n            num = k;\n        }\n    }\n    return num;\n}", "options": ["The number of times check occurs in str.", "The index of the first occurrence of check in str.", "The index of the last occurrence of check in str.", "The number of substrings in str with the same length as check."], "answer": "C", "explanation": "每次配對成功都把 num 更新為 k；迴圈沒有提前結束，所以最後保留最後一次出現的索引。", "source": "CB SG_Quiz22 · 原題 1（文字重新排版）", "sourceKey": "SG_Quiz22", "sourceNumber": 1, "set": 1, "provenance": "original-reformatted"}, {"id": "u2-m1-02", "unit": 2, "type": "mcq", "topic": "短路運算", "prompt": "Assume x and y are int variables. Which Java expression never results in a division by zero?", "code": "", "options": ["((y / x) == 0) \u0026\u0026 (x != 0)", "((y / x) == 0) || (x != 0)", "(x != 0) \u0026\u0026 ((y / x) == 0)", "(x != 0) || ((y / x) == 0)"], "answer": "C", "explanation": "\u0026\u0026 從左至右計算。當 x 為 0 時先得到 false，右側的 y / x 不會執行。", "source": "CB SG_Quiz22 · 原題 3（文字重新排版）", "sourceKey": "SG_Quiz22", "sourceNumber": 3, "set": 1, "provenance": "original-reformatted"}, {"id": "u2-m1-03", "unit": 2, "type": "mcq", "topic": "條件除錯", "prompt": "The method should return true for multiples of 4, except multiples of 100 unless also multiples of 400. Which call returns an incorrect response?", "code": "public boolean isLeapYear(int val) {\n    if ((val % 4) == 0) {\n        return true;\n    } else {\n        return (val % 400) == 0;\n    }\n}", "options": ["isLeapYear(1900)", "isLeapYear(1984)", "isLeapYear(2000)", "isLeapYear(2001)"], "answer": "A", "explanation": "1900 可被 4 整除而回傳 true，但它可被 100 整除且不可被 400 整除，應回傳 false。", "source": "CB SG_Quiz22 · 原題 7（文字重新排版）", "sourceKey": "SG_Quiz22", "sourceNumber": 7, "set": 1, "provenance": "original-reformatted"}, {"id": "u2-m1-04", "unit": 2, "type": "mcq", "topic": "獨立 if", "prompt": "Which method call returns the value 11?", "code": "public static int mystery(boolean a, boolean b, boolean c) {\n    int answer = 7;\n    if (!a) { answer += 1; }\n    if (b)  { answer += 2; }\n    if (c)  { answer += 4; }\n    return answer;\n}", "options": ["mystery(true, true, true)", "mystery(true, false, true)", "mystery(false, true, false)", "mystery(false, false, true)"], "answer": "B", "explanation": "a 為 true，所以 !a 為 false；b 為 false；只有 c 的分支執行，結果是 7 + 4 = 11。", "source": "CB SG_Quiz23 · 原題 1（文字重新排版）", "sourceKey": "SG_Quiz23", "sourceNumber": 1, "set": 1, "provenance": "original-reformatted"}, {"id": "u2-m1-05", "unit": 2, "type": "mcq", "topic": "while 追蹤", "prompt": "What is printed as a result of executing the code segment?", "code": "int num = 1;\nwhile (num \u003c 5) {\n    System.out.print(\"A\");\n    num += 2;\n}", "options": ["A", "AA", "AAA", "AAAA"], "answer": "B", "explanation": "num 依序為 1、3、5；只有前兩次符合 num \u003c 5，因此印出 AA。", "source": "CB SG_Quiz23 · 原題 7（文字重新排版）", "sourceKey": "SG_Quiz23", "sourceNumber": 7, "set": 1, "provenance": "original-reformatted"}, {"id": "u2-m1-06", "unit": 2, "type": "mcq", "topic": "迴圈與條件", "prompt": "What, if anything, is printed as a result of executing the code segment?", "code": "for (int k = 0; k \u003c 9; k = k + 2) {\n    if ((k % 2) != 0) {\n        System.out.print(k + \" \");\n    }\n}", "options": ["0 2 4 6 8", "1 3 5 7 9", "1 3 5 7", "Nothing is printed."], "answer": "D", "explanation": "k 只會是 0、2、4、6、8，皆為偶數；if 只印奇數，因此沒有輸出。", "source": "CB SG_Quiz23 · 原題 10（文字重新排版）", "sourceKey": "SG_Quiz23", "sourceNumber": 10, "set": 1, "provenance": "original-reformatted"}, {"id": "u2-m1-07", "unit": 2, "type": "mcq", "set": 1, "topic": "邊界差異", "prompt": "Changing i \u003c 4 to i \u003c= 4 has what effect?", "code": "for (int i = 0; i \u003c 4; i++) {\n    System.out.print(i);\n}", "options": ["An infinite loop.", "One fewer loop iteration.", "One additional loop iteration.", "No change."], "answer": "C", "explanation": "原本 i 是 0 到 3；修改後會多執行 i == 4 的一次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "inclusive-bound"}, {"id": "u2-m1-08", "unit": 2, "type": "mcq", "set": 1, "topic": "短路保護", "prompt": "Which expression is safe for every int x, including zero?", "code": "int y = 10;", "options": ["(x != 0) \u0026\u0026 (y / x \u003e 1)", "(y / x \u003e 1) \u0026\u0026 (x != 0)", "(x != 0) || (y / x \u003e 1)", "(y / x \u003e 1) || (x == 0)"], "answer": "A", "explanation": "\u0026\u0026 先判斷 x != 0；當為 false 時右側除法不執行。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "short-circuit"}, {"id": "u2-m1-09", "unit": 2, "type": "mcq", "set": 1, "topic": "De Morgan", "prompt": "Which expression is equivalent to !(x \u003c 1 || x \u003e 11)?", "code": "", "options": ["x \u003c= 1 \u0026\u0026 x \u003e= 11", "x \u003c 1 \u0026\u0026 x \u003e 11", "x \u003e= 1 \u0026\u0026 x \u003c= 11", "x \u003e= 1 || x \u003c= 11"], "answer": "C", "explanation": "否定 OR 改成 AND，並將每個比較條件取反；邊界需包含等號。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "demorgan"}, {"id": "u2-m1-10", "unit": 2, "type": "mcq", "set": 1, "topic": "範圍條件", "prompt": "Which condition is true exactly when x is between 5 and 15, inclusive?", "code": "", "options": ["x \u003e= 5 || x \u003c= 15", "x \u003e= 5 \u0026\u0026 x \u003c= 15", "x \u003e 5 \u0026\u0026 x \u003c 15", "x \u003c= 5 \u0026\u0026 x \u003e= 15"], "answer": "B", "explanation": "「介於兩端且包含端點」使用 \u003e=、\u003c= 與 \u0026\u0026。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "range"}, {"id": "u2-m1-11", "unit": 2, "type": "mcq", "set": 1, "topic": "條件加總", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 0; k \u003c 7; k++) {\n    if (k % 2 == 0) { sum += k; }\n}\nSystem.out.print(sum);", "options": ["0", "13", "14", "12"], "answer": "D", "explanation": "只加總小於 7 的非負偶數，總和為 12。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "even-sum"}, {"id": "u2-m1-12", "unit": 2, "type": "mcq", "set": 1, "topic": "數字演算法", "prompt": "What is printed?", "code": "int n = 133;\nint result = 0;\nwhile (n \u003e 0) {\n    result = result * 10 + n % 10;\n    n /= 10;\n}\nSystem.out.print(result);", "options": ["341", "133", "331", "7"], "answer": "C", "explanation": "每次取出最後一位並接在 result 右側，將 133 的數字反轉為 331。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reverse-digits"}, {"id": "u2-m1-13", "unit": 2, "type": "mcq", "set": 1, "topic": "累加器", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 1; k \u003c= 4; k++) { sum += k; }\nSystem.out.print(sum);", "options": ["4", "14", "9", "10"], "answer": "D", "explanation": "加總 1 到 4，結果為 4 × 5 / 2 = 10。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "sum"}, {"id": "u2-m1-14", "unit": 2, "type": "mcq", "set": 1, "topic": "字串走訪", "prompt": "What is printed?", "code": "String text = \"banana\";\nint count = 0;\nfor (int k = 0; k \u003c text.length(); k++) {\n    if (text.substring(k, k + 1).equals(\"a\")) { count++; }\n}\nSystem.out.print(count);", "options": ["3", "4", "6", "2"], "answer": "A", "explanation": "逐一擷取字元並計算 a，\"banana\" 中共有 3 個 a。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "string-count"}, {"id": "u2-m1-15", "unit": 2, "type": "mcq", "set": 1, "topic": "最後出現位置", "prompt": "What is printed?", "code": "String text = \"banana\";\nint last = -1;\nfor (int k = 0; k \u003c text.length(); k++) {\n    if (text.substring(k, k + 1).equals(\"a\")) { last = k; }\n}\nSystem.out.print(last);", "options": ["5", "6", "1", "-1"], "answer": "A", "explanation": "每次找到 a 就覆寫 last，最後保留最右側 a 的索引 5。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "last-index"}, {"id": "u2-m1-16", "unit": 2, "type": "mcq", "set": 1, "topic": "三角形迴圈", "prompt": "How many stars are printed in total?", "code": "for (int row = 1; row \u003c= 4; row++) {\n    for (int col = 0; col \u003c row; col++) {\n        System.out.print(\"*\");\n    }\n}", "options": ["4", "16", "14", "10"], "answer": "D", "explanation": "每列印出 1、2、…、4 個星號，總共 10 個。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "triangle"}, {"id": "u3-m1-01", "unit": 3, "type": "mcq", "set": 1, "topic": "建構子初始化", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int start) { value = start; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox box = new Box(4);\nSystem.out.print(box.getValue());", "options": ["4", "-1", "5", "0"], "answer": "A", "explanation": "建構子把參數 4 保存到 value，getter 回傳 4。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor"}, {"id": "u3-m1-02", "unit": 3, "type": "mcq", "set": 1, "topic": "參數遮蔽", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int value) { value = value; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nSystem.out.print(new Box(4).getValue());", "options": ["1", "4", "0", "-1"], "answer": "C", "explanation": "value = value 只把參數指定給自己，未更新實例欄位；int 欄位仍為預設值 0。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "shadowing"}, {"id": "u3-m1-03", "unit": 3, "type": "mcq", "set": 1, "topic": "Getter", "prompt": "Which method returns the private instance field points?", "code": "private int points = 4;", "options": ["public int getPoints() { return \"points\"; }", "public int getPoints() { return points; }", "public void getPoints() { return points; }", "public int getPoints(int points) { return 0; }"], "answer": "B", "explanation": "Getter 的回傳型別為 int，回傳欄位 points，且不需要輸入參數。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "getter"}, {"id": "u3-m1-04", "unit": 3, "type": "mcq", "set": 1, "topic": "Setter", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int v) { value = v; }\n    public void setValue(int v) { value = v; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox b = new Box(4);\nb.setValue(6);\nSystem.out.print(b.getValue());", "options": ["7", "0", "6", "4"], "answer": "C", "explanation": "setValue 以新值 6 替換原本的 4。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "setter"}, {"id": "u3-m1-05", "unit": 3, "type": "mcq", "set": 1, "topic": "回傳型別", "prompt": "Which declaration correctly returns the result of 4.0 / 2?", "code": "", "options": ["public double half() { return 4.0 / 2; }", "public int half() { return 4.0 / 2; }", "public boolean half() { return 4.0 / 2; }", "public void half() { return 4.0 / 2; }"], "answer": "A", "explanation": "double 運算結果需由相容的回傳型別傳回；int 不可隱含接收 double。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "return-type"}, {"id": "u3-m1-06", "unit": 3, "type": "mcq", "set": 1, "topic": "基本型別傳值", "prompt": "What is printed?", "code": "// In the same class:\npublic static void change(int x) { x += 2; }\n// In main:\nint n = 4;\nchange(n);\nSystem.out.print(n);", "options": ["8", "0", "6", "4"], "answer": "D", "explanation": "參數 x 是呼叫時 n 的值的複本；修改 x 不會修改外部 n。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "primitive-parameter"}, {"id": "u3-m1-07", "unit": 3, "type": "mcq", "set": 1, "topic": "物件參數", "prompt": "Assume Box has an int field value and a public setValue/getValue pair. What is printed?", "code": "public static void change(Box b) { b.setValue(6); }\n// In main:\nBox item = new Box(4);\nchange(item);\nSys 題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "negative-max"}, {"id": "u4-m1-08", "unit": 4, "type": "mcq", "set": 1, "topic": "線性搜尋", "prompt": "What is printed?", "code": "int[] a = {3, 6, 9, 12};\nint found = -1;\nfor (int k = 0; k \u003c a.length; k++) {\n    if (a[k] == 9) { found = k; }\n}\nSystem.out.print(found);", "options": ["-1", "9", "3", "2"], "answer": "D", "explanation": "目標 9 位於索引 2，found 更新為 2。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "linear-search"}, {"id": "u4-m1-09", "unit": 4, "type": "mcq", "set": 1, "topic": "ArrayList 插入", "prompt": "What is printed? Assume java.util.ArrayList is imported.", "code": "ArrayList\u003cString\u003e list = new ArrayList\u003cString\u003e();\nlist.add(\"A\");\nlist.add(\"B\");\nlist.add(1, \"X\");\nSystem.out.print(list);", "options": ["[A, X]", "[X, A, B]", "[A, B, X]", "[A, X, B]"], "answer": "D", "explanation": "add(1, element) 在索引 1 插入，原本 B 向右移。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-insert"}, {"id": "u4-m1-10", "unit": 4, "type": "mcq", "set": 1, "topic": "ArrayList 移除", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cInteger\u003e nums = new ArrayList\u003cInteger\u003e();\nnums.add(2);\nnums.add(5);\nnums.add(8);\nnums.remove(1);\nSystem.out.print(nums);", "options": ["[2, 5]", "[5, 8]", "[2, 8]", "[2, 5, 8]"], "answer": "C", "explanation": "remove(1) 使用 int 參數，移除索引 1 的元素，不是移除值為 1 的元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-remove"}, {"id": "u4-m1-11", "unit": 4, "type": "mcq", "set": 1, "topic": "ArrayList.set", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cString\u003e words = new ArrayList\u003cString\u003e();\nwords.add(\"A\");\nwords.add(\"B\");\nString old = words.set(0, \"X\");\nSystem.out.print(old + \" \" + words.size()) amily": "substring"}, {"id": "u1-m2-05", "unit": 1, "type": "mcq", "set": 2, "topic": "String.length", "prompt": "What is the value of size?", "code": "String text = \"AP Computer\";\nint size = text.length();", "options": ["12", "0", "11", "10"], "answer": "C", "explanation": "length() 計算全部字元，包含空格，共 11 個。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "length"}, {"id": "u1-m2-06", "unit": 1, "type": "mcq", "set": 2, "topic": "indexOf", "prompt": "What is printed?", "code": "String text = \"coconut\";\nSystem.out.print(text.indexOf(\"co\"));", "options": ["-1", "1", "7", "0"], "answer": "D", "explanation": "第一次出現 \"co\" 的索引為 0，索引從 0 開始。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "indexOf"}, {"id": "u1-m2-07", "unit": 1, "type": "mcq", "set": 2, "topic": "Math.abs", "prompt": "What is printed?", "code": "System.out.print(Math.abs(-10) + 2);", "options": ["-8", "8", "12", "10"], "answer": "C", "explanation": "絕對值為 10，再加 2 得到 12。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "abs"}, {"id": "u1-m2-08", "unit": 1, "type": "mcq", "set": 2, "topic": "Math.pow", "prompt": "What is the value of result?", "code": "double result = Math.pow(3, 3);", "options": ["27.0", "28.0", "30.0", "9.0"], "answer": "A", "explanation": "Math.pow(3, 3) 表示 3 的三次方，結果為 27.0。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "pow"}, {"id": "u1-m2-09", "unit": 1, "type": "mcq", "set": 2, "topic": "Math.sqrt", "prompt": "What is the value of result?", "code": "double result = Math.sqrt(25);", "options": ["5.0", "6.0", "4.0", "25.0"], "answer": "A", "explanation": "5 × 5 = 25，平方根為 5.0。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "sqrt"}, {"id": "u1-m2-10", "unit": 1, "type": "mcq", "set": 2, "topic": "Math.random", "prompt": "Which inclusive integer range can result?", "code": "int value = (int) (Math.random() * 6) + 4;", "options": ["1 through 6", "4 through 10", "4 through 9", "0 through 6"], "answer": "C", "explanation": "轉成 int 後為 0 到 5；加 4 後為 4 到 9。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "random-range"}, {"id": "u1-m2-11", "unit": 1, "type": "mcq", "set": 2, "topic": "參數型別", "prompt": "Assume double average(int total, int count) is defined. Which assignment compiles?", "code": "", "options": ["double result = average(20.5, 3);", "double result = average(20, 3);", "int result = average(20, 3);", "double result = average(true, 3);"], "answer": "B", "explanation": "方法要求兩個 int，並回傳 double；double 區域變數可接收結果。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-types"}, {"id": "u1-m2-12", "unit": 1, "type": "mcq", "set": 2, "topic": "例外判斷", "prompt": "Which value of y causes an ArithmeticException?", "code": "int x = 4 / y;", "options": ["0", "1", "4", "-1"], "answer": "A", "explanation": "int 除以 0 會造成 ArithmeticException。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "division-zero"}, {"id": "u1-m2-13", "unit": 1, "type": "mcq", "set": 2, "topic": "實例方法", "prompt": "Printer has a public non-static void method printPage(). Object printer is initialized in another class. Which call is valid?", "code": "", "options": ["Printer.printPage();", "printer.printPage();", "printer.printPage;", "printPage(printer);"], "answer": "B", "explanation": "非 static 方法必須以物件參考加上點運算子呼叫，並包含括號。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "instance-call"}, {"id": "u1-m2-14", "unit": 1, "type": "mcq", "set": 2, "topic": "String 不可變", "prompt": "What is printed?", "code": "String text = \"java\";\ntext.substring(1);\nSystem.out.print(text);", "options": ["j", "ava", "java", "JAVA"], "answer": "C", "explanation": "substring 回傳新字串；未把回傳值指定回 text，因此原參考不變。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "immutable"}, {"id": "u1-m2-15", "unit": 1, "type": "mcq", "set": 2, "topic": "參考與內容", "prompt": "What is printed?", "code": "String a = new String(\"JAVA\");\nString b = new String(\"JAVA\");\nSystem.out.print(a.equals(b) + \" \" + (a == b));", "options": ["true true", "false true", "true false", "false false"], "answer": "C", "explanation": "兩個 new 建立不同物件，所以 == 為 false；內容相同，equals 為 true。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "equals-reference"}, {"id": "u1-m2-16", "unit": 1, "type": "mcq", "set": 2, "topic": "整數截斷", "prompt": "What is printed?", "code": "double value = 26.9;\nint n = (int) value;\nSystem.out.print(n);", "options": ["26", "26.9", "25", "27"], "answer": "A", "explanation": "轉為 int 會朝 0 截斷小數，所以得到 26。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "narrowing"}, {"id": "u2-m2-01", "unit": 2, "type": "mcq", "set": 2, "topic": "獨立 if", "prompt": "What is printed?", "code": "int x = 6;\nif (x \u003e 3) { x += 2; }\nif (x \u003e 7) { x *= 2; }\nSystem.out.print(x);", "options": ["12", "8", "6", "16"], "answer": "D", "explanation": "第一個 if 把 x 變為 8；第二個條件也成立，再乘 2 得 16。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "independent-if"}, {"id": "u2-m2-02", "unit": 2, "type": "mcq", "set": 2, "topic": "互斥分支", "prompt": "What is printed?", "code": "int score = 65;\nif (score \u003e= 90) { System.out.print(\"A\"); }\nelse if (score \u003e= 80) { System.out.print(\"B\"); }\nelse if (score \u003e= 60) { System.out.print(\"C\"); }\nelse { System.out.print(\"D\"); }", "options": ["D", "C", "A", "B"], "answer": "B", "explanation": "65 分選中 C 分支，else-if 鏈只執行第一個成立分支。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "else-if"}, {"id": "u2-m2-03", "unit": 2, "type": "mcq", "set": 2, "topic": "巢狀條件", "prompt": "What is the final value of x?", "code": "int x = 4;\nint y = 5;\nif (x \u003c y) {\n    if (y \u003e 0) { x += 3; }\n    else { x -= 3; }\n}", "options": ["7", "5", "4", "1"], "answer": "A", "explanation": "x \u003c y 且 y \u003e 0，進入內層 if，x 增加 3 得 7。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "nested-if"}, {"id": "u2-m2-04", "unit": 2, "type": "mcq", "set": 2, "topic": "for 次數", "prompt": "How many times is X printed?", "code": "for (int k = 1; k \u003c 9; k += 2) {\n    System.out.print(\"X\");\n}", "options": ["9", "4", "3", "5"], "answer": "B", "explanation": "k 依序為 1, 3, 5, 7，共 4 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "for-count"}, {"id": "u2-m2-05", "unit": 2, "type": "mcq", "set": 2, "topic": "while 次數", "prompt": "How many times is A printed?", "code": "int n = 1;\nwhile (n \u003c 9) {\n    System.out.print(\"A\");\n    n += 3;\n}", "options": ["3", "9", "4", "2"], "answer": "A", "explanation": "n 從 1 每次加 3，在到達或超過 9 前共執行 3 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "while-count"}, {"id": "u2-m2-06", "unit": 2, "type": "mcq", "set": 2, "topic": "巢狀迴圈", "prompt": "How many times is hop printed?", "code": "for (int i = 0; i \u003c 4; i++) {\n    for (int j = 0; j \u003c 5; j++) {\n        System.out.println(\"hop\");\n    }\n}", "options": ["9", "15", "20", "21"], "answer": "C", "explanation": "外層 4 次，每次內層 5 次，共 20 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "nested-count"}, {"id": "u2-m2-07", "unit": 2, "type": "mcq", "set": 2, "topic": "邊界差異", "prompt": "Changing i \u003c 5 to i \u003c= 5 has what effect?", "code": "for (int i = 0; i \u003c 5; i++) {\n    System.out.print(i);\n}", "options": ["An infinite loop.", "No change.", "One fewer loop iteration.", "One additional loop iteration."], "answer": "D", "explanation": "原本 i 是 0 到 4；修改後會多執行 i == 5 的一次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "inclusive-bound"}, {"id": "u2-m2-08", "unit": 2, "type": "mcq", "set": 2, "topic": "短路保護", "prompt": "Which expression is safe for every int x, including zero?", "code": "int y = 20;", "options": ["(y / x \u003e 1) \u0026\u0026 (x != 0)", "(y / x \u003e 1) || (x == 0)", "(x != 0) || (y / x \u003e 1)", "(x != 0) \u0026\u0026 (y / x \u003e 1)"], "answer": "D", "explanation": "\u0026\u0026 先判斷 x != 0；當為 false 時右側除法不執行。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "short-circuit"}, {"id": "u2-m2-09", "unit": 2, "type": "mcq", "set": 2, "topic": "De Morgan", "prompt": "Which expression is equivalent to !(x \u003c 2 || x \u003e 12)?", "code": "", "options": ["x \u003c 2 \u0026\u0026 x \u003e 12", "x \u003e= 2 \u0026\u0026 x \u003c= 12", "x \u003e= 2 || x \u003c= 12", "x \u003c= 2 \u0026\u0026 x \u003e= 12"], "answer": "B", "explanation": "否定 OR 改成 AND，並將每個比較條件取反；邊界需包含等號。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "demorgan"}, {"id": "u2-m2-10", "unit": 2, "type": "mcq", "set": 2, "topic": "範圍條件", "prompt": "Which condition is true exactly when x is between 10 and 20, inclusive?", "code": "", "options": ["x \u003e= 10 || x \u003c= 20", "x \u003c= 10 \u0026\u0026 x \u003e= 20", "x \u003e= 10 \u0026\u0026 x \u003c= 20", "x \u003e 10 \u0026\u0026 x \u003c 20"], "answer": "C", "explanation": "「介於兩端且包含端點」使用 \u003e=、\u003c= 與 \u0026\u0026。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "range"}, {"id": "u2-m2-11", "unit": 2, "type": "mcq", "set": 2, "topic": "條件加總", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 0; k \u003c 8; k++) {\n    if (k % 2 == 0) { sum += k; }\n}\nSystem.out.print(sum);", "options": ["12", "14", "13", "0"], "answer": "A", "explanation": "只加總小於 8 的非負偶數，總和為 12。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "even-sum"}, {"id": "u2-m2-12", "unit": 2, "type": "mcq", "set": 2, "topic": "數字演算法", "prompt": "What is printed?", "code": "int n = 146;\nint result = 0;\nwhile (n \u003e 0) {\n    result = result * 10 + n % 10;\n    n /= 10;\n}\nSystem.out.print(result);", "options": ["146", "11", "651", "641"], "answer": "D", "explanation": "每次取出最後一位並接在 result 右側，將 146 的數字反轉為 641。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reverse-digits"}, {"id": "u2-m2-13", "unit": 2, "type": "mcq", "set": 2, "topic": "累加器", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 1; k \u003c= 5; k++) { sum += k; }\nSystem.out.print(sum);", "options": ["15", "5", "20", "14"], "answer": "A", "explanation": "加總 1 到 5，結果為 5 × 6 / 2 = 15。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "sum"}, {"id": "u2-m2-14", "unit": 2, "type": "mcq", "set": 2, "topic": "字串走訪", "prompt": "What is printed?", "code": "String text = \"papaya\";\nint count = 0;\nfor (int k = 0; k \u003c text.length(); k++) {\n    if (text.substring(k, k + 1).equals(\"a\")) { count++; }\n}\nSystem.out.print(count);", "options": ["3", "4", "2", "6"], "answer": "A", "explanation": "逐一擷取字元並計算 a，\"papaya\" 中共有 3 個 a。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "string-count"}, {"id": "u2-m2-15", "unit": 2, "type": "mcq", "set": 2, "topic": "最後出現位置", "prompt": "What is printed?", "code": "String text = \"papaya\";\nint last = -1;\nfor (int k = 0; k \u003c text.length(); k++) {\n    if (text.substring(k, k + 1).equals(\"a\")) { last = k; }\n}\nSystem.out.print(last);", "options": ["1", "6", "-1", "5"], "answer": "D", "explanation": "每次找到 a 就覆寫 last，最後保留最右側 a 的索引 5。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "last-index"}, {"id": "u2-m2-16", "unit": 2, "type": "mcq", "set": 2, "topic": "三角形迴圈", "prompt": "How many stars are printed in total?", "code": "for (int row = 1; row \u003c= 5; row++) {\n    for (int col = 0; col \u003c row; col++) {\n        System.out.print(\"*\");\n    }\n}", "options": ["5", "15", "25", "20"], "answer": "B", "explanation": "每列印出 1、2、…、5 個星號，總共 15 個。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "triangle"}, {"id": "u3-m2-01", "unit": 3, "type": "mcq", "set": 2, "topic": "建構子初始化", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int start) { value = start; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox box = new Box(5);\nSystem.out.print(box.getValue());", "options": ["0", "5", "-1", "6"], "answer": "B", "explanation": "建構子把參數 5 保存到 value，getter 回傳 5。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor"}, {"id": "u3-m2-02", "unit": 3, "type": "mcq", "set": 2, "topic": "參數遮蔽", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int value) { value = value; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nSystem.out.print(new Box(5).getValue());", "options": ["0", "5", "1", "-1"], "answer": "A", "explanation": "value = value 只把參數指定給自己，未更新實例欄位；int 欄位仍為預設值 0。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "shadowing"}, {"id": "u3-m2-03", "unit": 3, "type": "mcq", "set": 2, "topic": "Getter", "prompt": "Which method returns the private instance field points?", "code": "private int points = 5;", "options": ["public void getPoints() { return points; }", "public int getPoints() { return points; }", "public int getPoints() { return \"points\"; }", "public int getPoints(int points) { return 0; }"], "answer": "B", "explanation": "Getter 的回傳型別為 int，回傳欄位 points，且不需要輸入參數。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "getter"}, {"id": "u3-m2-04", "unit": 3, "type": "mcq", "set": 2, "topic": "Setter", "prompt": "What is printed?", "code": "class Box {\n    private int value;\n    public Box(int v) { value = v; }\n    public void setValue(int v) { value = v; }\n    public int getValue() { return value; }\n}\n// In a separate method:\nBox b = new Box(5);\nb.setValue(9);\nSystem.out.print(b.getValue());", "options": ["5", "10", "0", "9"], "answer": "D", "explanation": "setValue 以新值 9 替換原本的 5。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "setter"}, {"id": "u3-m2-05", "unit": 3, "type": "mcq", "set": 2, "topic": "回傳型別", "prompt": "Which declaration correctly returns the result of 5.0 / 2?", "code": "", "options": ["public double half() { return 5.0 / 2; }", "public void half() { return 5.0 / 2; }", "public int half() { return 5.0 / 2; }", "public boolean half() { return 5.0 / 2; }"], "answer": "A", "explanation": "double 運算結果需由相容的回傳型別傳回；int 不可隱含接收 double。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "return-type"}, {"id": "u3-m2-06", "unit": 3, "type": "mcq", "set": 2, "topic": "基本型別傳值", "prompt": "What is printed?", "code": "// In the same class:\npublic static void change(int x) { x += 4; }\n// In main:\nint n = 5;\nchange(n);\nSystem.out.print(n);", "options": ["9", "5", "0", "13"], "answer": "B", "explanation": "參數 x 是呼叫時 n 的值的複本；修改 x 不會修改外部 n。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "primitive-parameter"}, {"id": "u3-m2-07", "unit": 3, "type": "mcq", "set": 2, "topic": "物件參數", "prompt": "Assume Box has an int field value and a public setValue/getValue pair. What is printed?", "code": "public static void change(Box b) { b.setValue(9); }\n// In main:\nBox item = new Box(5);\nchange(item);\nSystem.out.print(item.getValue());", "options": ["9", "5", "10", "0"], "answer": "A", "explanation": "傳遞的是參考值的複本，但仍指向同一個物件；修改欄位可由呼叫端觀察到。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reference-parameter"}, {"id": "u3-m2-08", "unit": 3, "type": "mcq", "set": 2, "topic": "參考別名", "prompt": "Assume Counter(start) sets count, add(n) increases count, and getCount() returns count. What is printed?", "code": "Counter a = new Counter(5);\nCounter b = a;\nb.add(4);\nSystem.out.print(a.getCount());", "options": ["13", "10", "5", "9"], "answer": "D", "explanation": "a 與 b 指向同一個 Counter，因此透過 b 更新後，a 也看得到。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "aliasing"}, {"id": "u3-m2-09", "unit": 3, "type": "mcq", "set": 2, "topic": "static 欄位", "prompt": "What is printed? Assume no Item was created earlier.", "code": "class Item {\n    private static int total = 0;\n    public Item() { total++; }\n    public static int getTotal() { return total; }\n}\n// In a separate method:\nnew Item();\nnew Item();\nnew Item();\nSystem.out.print(Item.getTotal());", "options": ["3", "4", "0", "2"], "answer": "A", "explanation": "static total 由所有實例共享，每次 new 增加 1，共建立 3 個。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "static-state"}, {"id": "u3-m2-10", "unit": 3, "type": "mcq", "set": 2, "topic": "獨立實例", "prompt": "Assume Counter(start), add(n), and getCount() behave as their names indicate. What is printed?", "code": "Counter a = new Counter(5);\nCounter b = new Counter(5);\na.add(4);\nSystem.out.print(b.getCount());", "options": ["13", "9", "0", "5"], "answer": "D", "explanation": "兩次 new 建立不同物件；更新 a 不會更新 b 的實例欄位。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "separate-instances"}, {"id": "u3-m2-11", "unit": 3, "type": "mcq", "set": 2, "topic": "建構子多載", "prompt": "Which additional constructor is valid in this class?", "code": "public class Point {\n    private int x;\n    public Point() { x = 0; }\n    // additional constructor\n}", "options": ["public Point(int value) { x = value; }", "public void Point(int value) { x = value; }", "public Point() { x = 1; }", "public point(int value) { x = value; }"], "answer": "A", "explanation": "建構子名稱須為 Point、不能有回傳型別；參數列表不同才能多載。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "constructor-overload"}, {"id": "u3-m2-12", "unit": 3, "type": "mcq", "set": 2, "topic": "方法多載", "prompt": "Which method can be added without a duplicate-signature error?", "code": "public int scale(int value) { return value * 3; }", "options": ["public double scale(double value) { return value * 2; }", "public double scale(int value) { return value * 2.0; }", "private int scale(int value) { return value; }", "public int scale(int number) { return number + 1; }"], "answer": "A", "explanation": "不同參數型別 double 可形成多載；只改回傳型別、參數名稱或存取權限都不行。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-overload"}, {"id": "u3-m2-13", "unit": 3, "type": "mcq", "set": 2, "topic": "封裝", "prompt": "A separate class has a Box object b. Which statement about accessing its state is correct?", "code": "public class Box {\n    private int value = 5;\n    public int getValue() { return value; }\n}", "options": ["Both b.getValue() and b.value are allowed.", "b.value is allowed, but b.getValue() is not.", "Neither access is allowed.", "b.getValue() is allowed, but b.value is not."], "answer": "D", "explanation": "private 欄位不能由不同類別直接讀取，public getter 則可。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "visibility"}, {"id": "u3-m2-14", "unit": 3, "type": "mcq", "set": 2, "topic": "組合關係", "prompt": "Book.getPages() returns its page count. Which expression in Shelf.total() gets the stored book’s pages?", "code": "public class Shelf {\n    private Book current;\n    public Shelf(Book b) { current = b; }\n    public int total() { return /* missing */; }\n}", "options": ["current.pages", "Book.getPages()", "current.getPages()", "getPages(current)"], "answer": "C", "explanation": "current 是 Shelf 保存的 Book 物件，透過它呼叫公開的實例方法。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "composition"}, {"id": "u3-m2-15", "unit": 3, "type": "mcq", "set": 2, "topic": "參考重新指定", "prompt": "Assume Box(int), setValue(int), and getValue() work normally. What is printed?", "code": "Box a = new Box(5);\nBox b = a;\nb = new Box(9);\nb.setValue(10);\nSystem.out.print(a.getValue());", "options": ["9", "5", "10", "0"], "answer": "B", "explanation": "b 被重新指定到新物件，a 仍指向原本值為 5 的物件。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reassignment"}, {"id": "u3-m2-16", "unit": 3, "type": "mcq", "set": 2, "topic": "方法呼叫順序", "prompt": "Assume Counter(start), add(n), and getCount() work normally. What is printed?", "code": "Counter c = new Counter(5);\nc.add(4);\nc.add(c.getCount());\nSystem.out.print(c.getCount());", "options": ["17", "19", "18", "9"], "answer": "C", "explanation": "第一次 add 後為 9；第二次再加上目前值 9，得到 18。", "source": "主題改編：CB Quiz 3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "call-order"}, {"id": "u4-m2-01", "unit": 4, "type": "mcq", "set": 2, "topic": "陣列索引", "prompt": "What is printed?", "code": "int[] a = {4, 7, 10, 13};\nSystem.out.print(a[2]);", "options": ["13", "10", "0", "-1"], "answer": "B", "explanation": "索引從 0 開始，a[2] 是第 3 個元素 10。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-index"}, {"id": "u4-m2-02", "unit": 4, "type": "mcq", "set": 2, "topic": "預設元素", "prompt": "What is printed?", "code": "int[] a = new int[5];\nSystem.out.print(a[2]);", "options": ["-1", "0", "5", "2"], "answer": "B", "explanation": "int 陣列建立後每個元素預設為 0。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-default"}, {"id": "u4-m2-03", "unit": 4, "type": "mcq", "set": 2, "topic": "元素更新", "prompt": "What is printed?", "code": "int[] a = {4, 7, 10, 13};\na[1] += a[0];\nSystem.out.print(a[1]);", "options": ["4", "11", "7", "34"], "answer": "B", "explanation": "把 a[0] 的 4 加到 a[1] 的 7，得到 11。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-update"}, {"id": "u4-m2-04", "unit": 4, "type": "mcq", "set": 2, "topic": "增強型 for", "prompt": "What is printed?", "code": "int[] a = {4, 7, 10, 13};\nfor (int value : a) { value += 10; }\nSystem.out.print(a[0]);", "options": ["14", "4", "34", "10"], "answer": "B", "explanation": "int value 是目前元素值的複本；修改這個區域變數不會更新陣列元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "enhanced-for"}, {"id": "u4-m2-05", "unit": 4, "type": "mcq", "set": 2, "topic": "陣列別名", "prompt": "What is printed?", "code": "int[] a = {4, 7, 10, 13};\nint[] b = a;\nb[0] = 22;\nSystem.out.print(a[0]);", "options": ["13", "0", "22", "4"], "answer": "C", "explanation": "a 與 b 指向同一個陣列，透過 b 修改元素也會由 a 觀察到。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "array-alias"}, {"id": "u4-m2-06", "unit": 4, "type": "mcq", "set": 2, "topic": "反向走訪", "prompt": "What is printed, ignoring the trailing space?", "code": "int[] a = {4, 7, 10, 13};\nfor (int k = a.length - 1; k \u003e= 0; k--) {\n    System.out.print(a[k] + \" \");\n}", "options": ["13 10 7", "10 7 4", "4 7 10 13", "13 10 7 4"], "answer": "D", "explanation": "從最後索引 length − 1 遞減到 0，順序完全反轉。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "reverse-array"}, {"id": "u4-m2-07", "unit": 4, "type": "mcq", "set": 2, "topic": "最大值初始化", "prompt": "What is printed?", "code": "int[] a = {-10, -4, -7};\nint max = a[0];\nfor (int value : a) {\n    if (value \u003e max) { max = value; }\n}\nSystem.out.print(max);", "options": ["-4", "-21", "-10", "0"], "answer": "A", "explanation": "以第一個元素初始化可正確處理負數，最大值是 -4。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "negative-max"}, {"id": "u4-m2-08", "unit": 4, "type": "mcq", "set": 2, "topic": "線性搜尋", "prompt": "What is printed?", "code": "int[] a = {4, 7, 10, 13};\nint found = -1;\nfor (int k = 0; k \u003c a.length; k++) {\n    if (a[k] == 10) { found = k; }\n}\nSystem.out.print(found);", "options": ["2", "-1", "3", "10"], "answer": "A", "explanation": "目標 10 位於索引 2，found 更新為 2。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "linear-search"}, {"id": "u4-m2-09", "unit": 4, "type": "mcq", "set": 2, "topic": "ArrayList 插入", "prompt": "What is printed? Assume java.util.ArrayList is imported.", "code": "ArrayList\u003cString\u003e list = new ArrayList\u003cString\u003e();\nlist.add(\"A\");\nlist.add(\"B\");\nlist.add(1, \"Y\");\nSystem.out.print(list);", "options": ["[Y, A, B]", "[A, Y]", "[A, Y, B]", "[A, B, Y]"], "answer": "C", "explanation": "add(1, element) 在索引 1 插入，原本 B 向右移。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-insert"}, {"id": "u4-m2-10", "unit": 4, "type": "mcq", "set": 2, "topic": "ArrayList 移除", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cInteger\u003e nums = new ArrayList\u003cInteger\u003e();\nnums.add(3);\nnums.add(6);\nnums.add(9);\nnums.remove(1);\nSystem.out.print(nums);", "options": ["[6, 9]", "[3, 9]", "[3, 6]", "[3, 6, 9]"], "answer": "B", "explanation": "remove(1) 使用 int 參數，移除索引 1 的元素，不是移除值為 1 的元素。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-remove"}, {"id": "u4-m2-11", "unit": 4, "type": "mcq", "set": 2, "topic": "ArrayList.set", "prompt": "What is printed? Assume ArrayList is imported.", "code": "ArrayList\u003cString\u003e words = new ArrayList\u003cString\u003e();\nwords.add(\"A\");\nwords.add(\"B\");\nString old = words.set(0, \"Y\");\nSystem.out.print(old + \" \" + words.size());", "options": ["Y 3", "A 2", "Y 2", "A 3"], "answer": "B", "explanation": "set 替換索引 0 的元素並回傳舊值 A；串列大小仍為 2。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "list-set"}, {"id": "u4-m2-12", "unit": 4, "type": "mcq", "set": 2, "topic": "二維索引", "prompt": "What is printed?", "code": "int[][] grid = {{2, 3, 4}, {5, 6, 7}};\nSystem.out.print(grid[0][2]);", "options": ["4", "0", "14", "-1"], "answer": "A", "explanation": "先定位列索引 0，再定位欄索引 2，得到 4。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "matrix-index"}, {"id": "u4-m2-13", "unit": 4, "type": "mcq", "set": 2, "topic": "二維長度", "prompt": "What is printed?", "code": "int[][] grid = new int[3][5];\nSystem.out.print(grid.length + \" \" + grid[0].length);", "options": ["3 5", "3 15", "5 3", "15 5"], "answer": "A", "explanation": "grid.length 是列數 3，grid[0].length 是第 0 列欄數。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "matrix-length"}, {"id": "u4-m2-14", "unit": 4, "type": "mcq", "set": 2, "topic": "逐欄加總", "prompt": "What is printed?", "code": "int[][] grid = {{2, 3}, {4, 5}, {6, 7}};\nint sum = 0;\nfor (int row = 0; row \u003c grid.length; row++) {\n    sum += grid[row][1];\n}\nSystem.out.print(sum);", "options": ["27", "0", "5", "15"], "answer": "D", "explanation": "固定欄索引 1，加總 3、5、7，得到 15。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "column-sum"}, {"id": "u4-m2-15", "unit": 4, "type": "mcq", "set": 2, "topic": "遞迴追蹤", "prompt": "What is returned by sum(4)?", "code": "public static int sum(int n) {\n    if (n == 0) { return 0; }\n    return n + sum(n - 1);\n}", "options": ["10", "4", "11", "16"], "answer": "A", "explanation": "遞迴展開後是 4 + 3 + 2 + 1 + 0 = 10。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "recursion"}, {"id": "u4-m2-16", "unit": 4, "type": "mcq", "set": 2, "topic": "選擇排序一回合", "prompt": "What does a contain after this first selection-sort pass?", "code": "int[] a = {10, 8, 5, 3};\nint min = 0;\nfor (int k = 1; k \u003c a.length; k++) {\n    if (a[k] \u003c a[min]) { min = k; }\n}\nint temp = a[0];\na[0] = a[min];\na[min] = temp;", "options": ["[8, 5, 3, 10]", "[3, 5, 8, 10]", "[10, 8, 5, 3]", "[3, 8, 5, 10]"], "answer": "D", "explanation": "找到最小值 3 的索引 3，與索引 0 交換，其他元素不變。", "source": "主題改編：CB Quiz 4-1 / 4-2；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "selection-pass"}, {"id": "u1-m3-01", "unit": 1, "type": "mcq", "set": 3, "topic": "整數運算", "prompt": "What is printed?", "code": "int a = 7;\nint b = 13;\nSystem.out.print(a + b / 3 * 2);", "options": ["17", "13", "15", "16"], "answer": "C", "explanation": "整數除法 13 / 3 = 4，乘以 2 後加上 7，結果為 15。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "precedence"}, {"id": "u1-m3-02", "unit": 1, "type": "mcq", "set": 3, "topic": "型別轉換", "prompt": "What is the value of x?", "code": "double x = (double) 13 / 2;", "options": ["13.0", "15.0", "6.0", "6.5"], "answer": "D", "explanation": "先轉為 double，再除以 2，保留小數得到 6.5。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "cast-before-divide"}, {"id": "u1-m3-03", "unit": 1, "type": "mcq", "set": 3, "topic": "字串串接", "prompt": "What is printed?", "code": "System.out.print(\"N=\" + 5 + 6);", "options": ["N=11", "N=56", "N=65", "11"], "answer": "B", "explanation": "左邊已是字串，+ 由左至右進行串接，所以依序接上 5 與 6。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "concat"}, {"id": "u1-m3-04", "unit": 1, "type": "mcq", "set": 3, "topic": "substring", "prompt": "What is printed?", "code": "String word = \"PRINCIPLE\";\nSystem.out.print(word.substring(1, 4));", "options": ["PRIN", "RIN", "CIPLE", "RINC"], "answer": "B", "explanation": "擷取索引 1 到 3，不含結束索引 4。", "source": "主 : 1, "type": "mcq", "set": 3, "topic": "Math.random", "prompt": "Which inclusive integer range can result?", "code": "int value = (int) (Math.random() * 7) + 5;", "options": ["5 through 12", "5 through 11", "0 through 7", "1 through 7"], "answer": "B", "explanation": "轉成 int 後為 0 到 6；加 5 後為 5 到 11。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "random-range"}, {"id": "u1-m3-11", "unit": 1, "type": "mcq", "set": 3, "topic": "參數型別", "prompt": "Assume double average(int total, int count) is defined. Which assignment compiles?", "code": "", "options": ["double result = average(30.5, 4);", "double result = average(30, 4);", "double result = average(true, 4);", "int result = average(30, 4);"], "answer": "B", "explanation": "方法要求兩個 int，並回傳 double；double 區域變數可接收結果。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "method-types"}, {"id": "u1-m3-12", "unit": 1, "type": "mcq", "set": 3, "topic": "例外判斷", "prompt": "Which value of y causes an ArithmeticException?", "code": "int x = 5 / y;", "options": ["-1", "0", "5", "1"], "answer": "B", "explanation": "int 除以 0 會造成 ArithmeticException。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "division-zero"}, {"id": "u1-m3-13", "unit": 1, "type": "mcq", "set": 3, "topic": "實例方法", "prompt": "Timer has a public non-static void method start(). Object timer is initialized in another class. Which call is valid?", "code": "", "options": ["start(timer);", "timer.start();", "Timer.start();", "timer.start;"], "answer": "B", "explanation": "非 static 方法必須以物件參考加上點運算子呼叫，並包含括號。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "instance-call"}, {"id": "u1-m3-14", "unit": 1, "type": "mcq", "set": 3, "topic": "String 不可變", "prompt": "What is printed?", "code": "String text = \"learn\";\ntext.substring(1);\nSystem.out.print(text);", "options": ["earn", "l", "learn", "LEARN"], "answer": "C", "explanation": "substring 回傳新字串；未把回傳值指定回 text，因此原參考不變。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "immutable"}, {"id": "u1-m3-15", "unit": 1, "type": "mcq", "set": 3, "topic": "參考與內容", "prompt": "What is printed?", "code": "String a = new String(\"CODE\");\nString b = new String(\"CODE\");\nSystem.out.print(a.equals(b) + \" \" + (a == b));", "options": ["true true", "true false", "false false", "false true"], "answer": "B", "explanation": "兩個 new 建立不同物件，所以 == 為 false；內容相同，equals 為 true。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "equals-reference"}, {"id": "u1-m3-16", "unit": 1, "type": "mcq", "set": 3, "topic": "整數截斷", "prompt": "What is printed?", "code": "double value = 29.9;\nint n = (int) value;\nSystem.out.print(n);", "options": ["30", "29", "29.9", "28"], "answer": "B", "explanation": "轉為 int 會朝 0 截斷小數，所以得到 29。", "source": "主題改編：CB Quiz 1-1 / 1-2 / 1-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "narrowing"}, {"id": "u2-m3-01", "unit": 2, "type": "mcq", "set": 3, "topic": "獨立 if", "prompt": "What is printed?", "code": "int x = 7;\nif (x \u003e 3) { x += 2; }\nif (x \u003e 8) { x *= 2; }\nSystem.out.print(x);", "options": ["14", "9", "18", "7"], "answer": "C", "explanation": "第一個 if 把 x 變為 9；第二個條件也成立，再乘 2 得 18。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "independent-if"}, {"id": "u2-m3-02", "unit": 2, "type": "mcq", "set": 3, "topic": "互斥分支", "prompt": "What is printed?", "code": "int score = 75;\nif (score \u003e= 90) { System.out.print(\"A\"); }\nelse if (score \u003e= 80) { System.out.print(\"B\"); }\nelse if (score \u003e= 60) { System.out.print(\"C\"); }\nelse { System.out.print(\"D\"); }", "options": ["D", "B", "A", "C"], "answer": "D", "explanation": "75 分選中 C 分支，else-if 鏈只執行第一個成立分支。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "else-if"}, {"id": "u2-m3-03", "unit": 2, "type": "mcq", "set": 3, "topic": "巢狀條件", "prompt": "What is the final value of x?", "code": "int x = 5;\nint y = 6;\nif (x \u003c y) {\n    if (y \u003e 0) { x += 3; }\n    else { x -= 3; }\n}", "options": ["8", "5", "6", "2"], "answer": "A", "explanation": "x \u003c y 且 y \u003e 0，進入內層 if，x 增加 3 得 8。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "nested-if"}, {"id": "u2-m3-04", "unit": 2, "type": "mcq", "set": 3, "topic": "for 次數", "prompt": "How many times is X printed?", "code": "for (int k = 1; k \u003c 10; k += 2) {\n    System.out.print(\"X\");\n}", "options": ["6", "4", "10", "5"], "answer": "D", "explanation": "k 依序為 1, 3, 5, 7, 9，共 5 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "for-count"}, {"id": "u2-m3-05", "unit": 2, "type": "mcq", "set": 3, "topic": "while 次數", "prompt": "How many times is A printed?", "code": "int n = 1;\nwhile (n \u003c 11) {\n    System.out.print(\"A\");\n    n += 3;\n}", "options": ["4", "3", "11", "5"], "answer": "A", "explanation": "n 從 1 每次加 3，在到達或超過 11 前共執行 4 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "while-count"}, {"id": "u2-m3-06", "unit": 2, "type": "mcq", "set": 3, "topic": "巢狀迴圈", "prompt": "How many times is hop printed?", "code": "for (int i = 0; i \u003c 5; i++) {\n    for (int j = 0; j \u003c 6; j++) {\n        System.out.println(\"hop\");\n    }\n}", "options": ["30", "31", "11", "24"], "answer": "A", "explanation": "外層 5 次，每次內層 6 次，共 30 次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "nested-count"}, {"id": "u2-m3-07", "unit": 2, "type": "mcq", "set": 3, "topic": "邊界差異", "prompt": "Changing i \u003c 6 to i \u003c= 6 has what effect?", "code": "for (int i = 0; i \u003c 6; i++) {\n    System.out.print(i);\n}", "options": ["One fewer loop iteration.", "An infinite loop.", "No change.", "One additional loop iteration."], "answer": "D", "explanation": "原本 i 是 0 到 5；修改後會多執行 i == 6 的一次。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "inclusive-bound"}, {"id": "u2-m3-08", "unit": 2, "type": "mcq", "set": 3, "topic": "短路保護", "prompt": "Which expression is safe for every int x, including zero?", "code": "int y = 30;", "options": ["(x != 0) \u0026\u0026 (y / x \u003e 1)", "(x != 0) || (y / x \u003e 1)", "(y / x \u003e 1) \u0026\u0026 (x != 0)", "(y / x \u003e 1) || (x == 0)"], "answer": "A", "explanation": "\u0026\u0026 先判斷 x != 0；當為 false 時右側除法不執行。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "short-circuit"}, {"id": "u2-m3-09", "unit": 2, "type": "mcq", "set": 3, "topic": "De Morgan", "prompt": "Which expression is equivalent to !(x \u003c 3 || x \u003e 13)?", "code": "", "options": ["x \u003c= 3 \u0026\u0026 x \u003e= 13", "x \u003c 3 \u0026\u0026 x \u003e 13", "x \u003e= 3 \u0026\u0026 x \u003c= 13", "x \u003e= 3 || x \u003c= 13"], "answer": "C", "explanation": "否定 OR 改成 AND，並將每個比較條件取反；邊界需包含等號。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "demorgan"}, {"id": "u2-m3-10", "unit": 2, "type": "mcq", "set": 3, "topic": "範圍條件", "prompt": "Which condition is true exactly when x is between 15 and 25, inclusive?", "code": "", "options": ["x \u003e 15 \u0026\u0026 x \u003c 25", "x \u003e= 15 \u0026\u0026 x \u003c= 25", "x \u003c= 15 \u0026\u0026 x \u003e= 25", "x \u003e= 15 || x \u003c= 25"], "answer": "B", "explanation": "「介於兩端且包含端點」使用 \u003e=、\u003c= 與 \u0026\u0026。", "source": "主題改編：CB Quiz 2-1 / 2-2 / 2-3；依題庫概念重編情境與數值，非原題逐字轉錄", "provenance": "adapted", "family": "range"}, {"id": "u2-m3-11", "unit": 2, "type": "mcq", "set": 3, "topic": "條件加總", "prompt": "What is printed?", "code": "int sum = 0;\nfor (int k = 0;
